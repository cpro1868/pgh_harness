      <div class="flex items-center space-x-3 text-xs">

      </div>

    <!-- 上部：高保真 SVG BPMN 2.0 拓扑运行图 (动态流转高亮 原型 1:1) -->
    <div class="p-4 bg-[#090e1c] border-b border-[#1a2333] flex flex-col space-y-2 flex-shrink-0">
      <div class="flex items-center justify-between text-[11px] font-mono">
        <div class="flex items-center space-x-2">
          <span class="text-white font-bold">BPMN 2.0 实例拓扑流转视窗</span>
          <span class="text-slate-500 font-sans">（绿色表示已通过节点，黄色脉冲表示当前正在评估网关）</span>
        </div>
        <div class="flex items-center space-x-4 text-slate-400">
          <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5"></span>已流经节点</span>
          <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-amber-400 mr-1.5 animate-pulse"></span>正在评估 (Token)</span>
          <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-slate-600 mr-1.5"></span>待决分支</span>
        </div>
      </div>

      <!-- 动态高保真 SVG 图 (原型 1:1 风格) -->
      <div class="p-3 rounded-lg bg-[#070b14] border border-slate-800/90 overflow-x-auto flex justify-center">
        <svg id="monitor-svg" width="960" height="150" viewBox="0 0 960 150" class="select-none font-mono text-xs">
          <defs>
            <marker id="arrow-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
            </marker>
            <marker id="arrow-dim" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
            </marker>
          </defs>
          <g id="svg-paths-layer"></g>
          <g id="svg-nodes-layer"></g>
        </svg>
      </div>
    </div>

    <!-- 下部主体：左侧为人机协同干预对话窗口，右侧为上下文变量总线与决策审计 (原型 1:1) -->
    <div class="flex-1 flex overflow-hidden">
      
      <!-- 左侧：工作流人机干预与对话窗口 -->
      <div class="flex-1 flex flex-col bg-[#070a12] border-r border-[#1a2333] overflow-hidden">
        
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 max-w-3xl w-full mx-auto font-sans">
          <div class="p-2.5 rounded bg-[#090e1a] border border-slate-800 text-xs text-slate-400 flex items-center justify-between font-mono">
            <span id="inst-banner-text">🌐 流程实例运行会话 · 初始化</span>
            <span id="inst-start-time"></span>
          </div>

          <div id="execution-logs-list" class="space-y-3"></div>
        </div>

        <!-- 底部干预指令输入框 (原型 1:1) -->
        <div class="p-3 border-t border-[#1a2333] bg-[#090d18]">
          <div class="max-w-3xl mx-auto space-y-1.5">
            <div class="flex items-center justify-between text-[11px] text-slate-400">
              <span>对当前流程实例进行人工干预、注入变量或指令：</span>
              <span class="text-[10px] text-slate-500 font-mono">Enter 发送</span>
            </div>
            <div class="border border-slate-700/80 rounded-lg bg-[#0b101c] p-2 focus-within:border-emerald-500 transition">
              <textarea id="intervention-input" placeholder="输入干预指令或对当前任务的调整意见..." class="w-full bg-transparent border-0 resize-none text-xs text-white placeholder-slate-500 focus:outline-none min-h-[38px] max-h-24"></textarea>
              <div class="flex items-center justify-between pt-1 border-t border-slate-800/80 text-[11px]">
                <div class="flex items-center space-x-2 text-slate-500 text-[10px]">
                  <span id="intervention-status">实例状态: RUNNING</span>
                </div>
                <div class="flex items-center space-x-1.5">
                  <button type="button" onclick="submitIntervention()" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-[10px] transition">
                    提交干预指令
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- 右侧：全局上下文变量总线 (Variables Bus) 与审计 (原型 1:1) -->
      <div class="w-80 bg-[#090d18] border-l border-[#1a2333] p-4 space-y-4 overflow-y-auto flex-shrink-0 font-mono">
        
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-bold text-white">流程上下文变量总线</h3>
            <span class="text-[10px] text-emerald-400 font-semibold">Live Sync</span>
          </div>

          <div id="variables-bus-container" class="space-y-1.5 text-xs">
            <div class="text-slate-600 italic text-[11px]">暂无变量</div>
          </div>
        </div>

        <!-- 节点执行审计 -->
        <div class="space-y-2 pt-2 border-t border-slate-800">
          <h3 class="text-xs font-bold text-white">流转历史 (Passed Nodes)</h3>
          <div id="passed-nodes-container" class="space-y-1.5 text-[11px]">
            <div class="text-slate-600 italic text-[11px]">暂无历史节点</div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    let currentInstance = null;
    let currentWorkflow = null;

    function getParam(name) {
      return new URL(window.location.href).searchParams.get(name);
    }

    async function loadInstanceDetail() {
      const instanceId = getParam('instanceId');
      try {
        let inst = null;
        if (instanceId) {
          const res = await fetch(`/api/workflow-instances/${encodeURIComponent(instanceId)}`);
          const json = await res.json();
          if (json.code === 0 && json.data) inst = json.data;
        }

        // 若未提供参数或不存在，回退取第一个最近实例
        if (!inst) {
          const listRes = await fetch('/api/workflow-instances');
          const listJson = await listRes.json();
          if (listJson.code === 0 && Array.isArray(listJson.data) && listJson.data.length > 0) {
            inst = listJson.data[0];
          }
        }

        if (inst) {
          currentInstance = inst;
          document.getElementById('inst-title-display').textContent = inst.workflowName || inst.workflowId;
          document.getElementById('inst-id-display').textContent = `ID: ${inst.id.slice(0, 14)}`;
          document.getElementById('inst-banner-text').textContent = `🌐 流程实例 ${inst.id.slice(0, 10)} 运行 · 绑定工作区: ${inst.workspacePath || '默认工作区'}`;
          document.getElementById('inst-start-time').textContent = new Date(inst.startedAt).toLocaleTimeString();

          const isCompleted = inst.status === 'completed';
          const isWaiting = inst.status === 'waiting';
          let statusBadge = '<span class="text-amber-300 font-bold bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/40 animate-pulse">RUNNING</span>';
          if (isCompleted) {
            statusBadge = '<span class="text-emerald-400 font-bold bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/40">COMPLETED</span>';
          } else if (isWaiting) {
            statusBadge = '<span class="text-purple-300 font-bold bg-purple-950/80 px-2 py-0.5 rounded border border-purple-700 animate-pulse">WAITING APPROVAL</span>';
          }
          document.getElementById('status-badge-container').innerHTML = statusBadge;
          document.getElementById('intervention-status').textContent = `实例状态: ${inst.status.toUpperCase()}`;

          // 读取对应 workflow bpmnXml
          const wfRes = await fetch(`/api/workflows/${encodeURIComponent(inst.workflowId)}`);
          const wfJson = await wfRes.json();
          if (wfJson.code === 0) currentWorkflow = wfJson.data;

          renderMonitorTopology();
          renderVariablesBus();
          renderExecutionLogs();
        } else {
          document.getElementById('inst-title-display').textContent = '未找到可运行的实例';
        }
      } catch (err) {
        showToast('加载实例详情异常: ' + err.message, 'error');
      }
    }

    function renderMonitorTopology() {
      const pathsLayer = document.getElementById('svg-paths-layer');
      const nodesLayer = document.getElementById('svg-nodes-layer');
      if (!pathsLayer || !nodesLayer) return;

      const completed = new Set(currentInstance.completedNodes || []);
      const active = new Set(currentInstance.activeNodes || []);

      // 提取 BPMN 节点
      const xml = currentWorkflow ? currentWorkflow.bpmnXml : '';
      const nodes = [];
      const tagRegex = /<(?:[a-zA-Z0-9_]+:)?(startEvent|endEvent|task|userTask|serviceTask|exclusiveGateway|parallelGateway)\b([^>]*)(?:\/?>|>([\s\S]*?)<\/(?:[a-zA-Z0-9_]+:)?\1>)/gi;
      let m;
      while ((m = tagRegex.exec(xml)) !== null) {
        const idMatch = m[2].match(/id=["']([^"']+)["']/i);
        const nameMatch = m[2].match(/name=["']([^"']+)["']/i);
        if (idMatch) nodes.push({ id: idMatch[1], type: m[1], name: nameMatch ? nameMatch[1] : idMatch[1] });
      }

      // 水平流转拓扑布局 (原型 1:1)
      let nodesSvg = '';
      let pathsSvg = '';
      const startX = 45;
      const centerY = 75;
      const gapX = 170;

      nodes.forEach((n, idx) => {
        const cx = startX + idx * gapX;
        const cy = centerY;
        const isPassed = completed.has(n.id);
        const isActive = active.has(n.id) || (!completed.has(n.id) && idx === completed.size);

        const strokeColor = isPassed ? '#10b981' : (isActive ? '#f59e0b' : '#334155');
        const fillColor = isPassed ? '#064e3b' : (isActive ? '#451a03' : '#0f172a');

        if (idx > 0) {
          const prevX = startX + (idx - 1) * gapX + (nodes[idx - 1].type.includes('Event') ? 20 : 65);
          const nextX = cx - (n.type.includes('Event') ? 20 : 65);
          const pColor = isPassed ? '#10b981' : '#334155';
          const pMarker = isPassed ? 'url(#arrow-g)' : 'url(#arrow-dim)';
          pathsSvg += `<path d="M ${prevX} ${cy} L ${nextX} ${cy}" stroke="${pColor}" stroke-width="2" marker-end="${pMarker}" />`;
        }

        if (n.type.includes('Event')) {
          nodesSvg += `
            <circle cx="${cx}" cy="${cy}" r="18" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isActive ? '2.5' : '2'}" class="${isActive ? 'animate-pulse' : ''}" />
            <text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="bold">${escapeHtml(n.name || 'Event')}</text>
          `;
        } else if (n.type.includes('Gateway')) {
          nodesSvg += `
            <polygon points="${cx},${cy - 22} ${cx + 22},${cy} ${cx},${cy + 22} ${cx - 22},${cy}" fill="${fillColor}" stroke="${strokeColor}" stroke-width="2" class="${isActive ? 'animate-pulse' : ''}" />
            <text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">✕</text>
            <text x="${cx}" y="${cy + 36}" text-anchor="middle" fill="#f59e0b" font-size="9">${escapeHtml(n.name || '网关')}</text>
          `;
        } else {
          nodesSvg += `
            <rect x="${cx - 65}" y="${cy - 25}" width="130" height="50" rx="6" fill="${fillColor}" stroke="${strokeColor}" stroke-width="${isActive ? '2' : '1.5'}" class="${isActive ? 'animate-pulse' : ''}" />
            <text x="${cx}" y="${cy - 5}" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="bold">${escapeHtml(n.name)}</text>
            <text x="${cx}" y="${cy + 12}" text-anchor="middle" fill="#94a3b8" font-size="9">ID: ${escapeHtml(n.id)}</text>
          `;
        }
      });

      pathsLayer.innerHTML = pathsSvg;
      nodesLayer.innerHTML = nodesSvg;
    }

    function renderVariablesBus() {
      const container = document.getElementById('variables-bus-container');
      const vars = currentInstance.variables || {};
      const entries = Object.entries(vars);
      if (entries.length === 0) {
        container.innerHTML = '<div class="text-slate-600 italic text-[11px]">暂无变量</div>';
        return;
      }

      container.innerHTML = entries.map(([k, v]) => `
        <div class="p-2 rounded bg-[#0b101c] border border-slate-800">
          <div class="text-slate-500 text-[10px]">${escapeHtml(k)}</div>
          <div class="text-amber-300 font-bold mt-0.5 truncate">${escapeHtml(JSON.stringify(v))}</div>
        </div>
      `).join('');
    }

    function renderExecutionLogs() {
      const logsList = document.getElementById('execution-logs-list');
      const passedContainer = document.getElementById('passed-nodes-container');
      const logs = currentInstance.executionLog || [];

      if (logs.length === 0) {
        logsList.innerHTML = '<div class="p-4 text-center text-slate-500 font-mono text-xs">暂无执行活动日志</div>';
        passedContainer.innerHTML = '<div class="text-slate-600 italic text-[11px]">暂无流转历史</div>';
        return;
      }

      let logsHtml = '';

      // 若实例处于 waiting approval 状态，在顶部显式渲染人工审查卡片
      if (currentInstance.status === 'waiting') {
        const activeNodeId = (currentInstance.activeNodes || [])[0] || 'UserTask_Review';
        logsHtml += `
          <div class="p-4 rounded-xl bg-purple-950/40 border border-purple-500/60 space-y-3 shadow-lg">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-purple-300 flex items-center">
                <span class="w-2.5 h-2.5 rounded-full bg-purple-400 mr-2 animate-ping"></span>
                🛡️ 人工审批卡点：流程已挂起等待审查 (${escapeHtml(activeNodeId)})
              </span>
              <span class="text-[10px] text-purple-400 font-mono">WAITING_APPROVAL</span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">
              上游自动化编码与测试已完成，当前处于 UserTask 人工审查门。请审查交付物并做出决策：放行推进下游流程，或驳回打回上一阶段。
            </p>
            <div class="flex items-center space-x-2 pt-1 border-t border-purple-900/60">
              <button type="button" onclick="decideUserTask('approve')" class="px-3.5 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow transition flex items-center space-x-1">
                <span>✅ 批准并放行推进</span>
              </button>
              <button type="button" onclick="decideUserTask('reject')" class="px-3.5 py-1.5 rounded bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-800 text-xs transition flex items-center space-x-1">
                <span>↩️ 驳回打回重做</span>
              </button>
            </div>
          </div>
        `;
      }

      logsHtml += logs.map(l => `
        <div class="space-y-1">
          <div class="flex items-center space-x-2 text-[11px]">
            <span class="font-bold text-emerald-400 font-mono">${escapeHtml(l.name || l.nodeId)}</span>
            <span class="text-slate-500 text-[10px] font-mono">${new Date(l.timestamp).toLocaleTimeString()}</span>
          </div>
          <div class="p-3 rounded-lg bg-[#0e1526] border border-slate-800 text-xs text-slate-200 leading-relaxed font-mono">
            ${escapeHtml(l.output || `节点 [${l.nodeId}] 顺利流转执行完毕。`)}
          </div>
        </div>
      `).join('');

      logsList.innerHTML = logsHtml;

      passedContainer.innerHTML = logs.map(l => `
        <div class="p-2 rounded bg-[#0b101c] border border-slate-800 text-slate-300">
          <div class="text-emerald-400 font-semibold truncate">✓ ${escapeHtml(l.name || l.nodeId)}</div>
          <div class="text-slate-500 text-[10px]">${new Date(l.timestamp).toLocaleTimeString()}</div>
        </div>
      `).join('');
    }

    async function decideUserTask(decision) {
      if (!currentInstance) return;
      let reason = '';
      if (decision === 'reject') {
        const input = prompt('请输入驳回原因或修改要求：', '验收未通过，请重新修改。');
        if (!input || !input.trim()) return;
        reason = input.trim();
      }

      try {
        const res = await fetch(`/api/workflow-instances/${encodeURIComponent(currentInstance.id)}/decide`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decision, reason }),
        });
        const json = await res.json();
        if (json.code === 0 && json.data) {
          showToast(decision === 'approve' ? '✅ 人工审批已放行，流程继续推进！' : '↩️ 已打回重做', 'success');
          await loadInstanceDetail();
        } else {
          showToast('审查决策提交失败: ' + (json.message || '未知错误'), 'error');
        }
      } catch (err) {
        showToast('请求异常: ' + err.message, 'error');
      }
    }

    function submitIntervention() {
      const text = document.getElementById('intervention-input').value.trim();
      if (!text) {
        showToast('请输入干预指令！', 'warning');
        return;
      }
      showToast('✓ 干预指令已送达工作流运行时队列', 'success');
      document.getElementById('intervention-input').value = '';
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    window.addEventListener('DOMContentLoaded', loadInstanceDetail);
  </script>
</body>
</html>
