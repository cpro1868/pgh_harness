<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="ico/pgh.svg">
  <title>主会话工作台 - Purple Grapes Harness (PGH)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    /* Markdown 暗色调精美样式 (对齐 deepseek-harness 高信息密度体验) */
    .prose-dark {
      color: #e2e8f0;
      line-height: 1.6;
      font-size: 13px;
    }
    .prose-dark h1, .prose-dark h2, .prose-dark h3, .prose-dark h4 {
      color: #f8fafc;
      font-weight: 700;
      margin-top: 0.8em;
      margin-bottom: 0.4em;
    }
    .prose-dark h1 { font-size: 1.3em; border-bottom: 1px solid #334155; padding-bottom: 0.3em; }
    .prose-dark h2 { font-size: 1.15em; border-bottom: 1px solid #1e293b; padding-bottom: 0.2em; }
    .prose-dark h3 { font-size: 1.05em; }
    .prose-dark p { margin-bottom: 0.6em; }
    .prose-dark ul, .prose-dark ol { padding-left: 1.4em; margin-bottom: 0.6em; }
    .prose-dark ul { list-style-type: disc; }
    .prose-dark ol { list-style-type: decimal; }
    .prose-dark li { margin-bottom: 0.2em; }
    .prose-dark blockquote {
      border-left: 3px solid #6366f1;
      padding-left: 0.8em;
      color: #94a3b8;
      margin: 0.6em 0;
      background: rgba(99, 102, 241, 0.05);
      border-radius: 0 4px 4px 0;
    }
    .prose-dark pre {
      background: #090d16 !important;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      margin: 0.6em 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
    }
    .prose-dark code:not(pre code) {
      background: #1e293b;
      color: #38bdf8;
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
    }
    .prose-dark table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.6em 0;
      font-size: 11px;
    }
    .prose-dark th, .prose-dark td {
      border: 1px solid #334155;
      padding: 6px 10px;
      text-align: left;
    }
    .prose-dark th {
      background: #0f172a;
      color: #f1f5f9;
      font-weight: 600;
    }
    .prose-dark tr:nth-child(even) {
      background: rgba(15, 23, 42, 0.4);
    }
  </style>
</head>
<body class="bg-[#070a12] text-slate-100 font-sans flex flex-col h-screen overflow-hidden">

  <!-- 统一 40px 顶栏 -->
  <header class="h-10 border-b border-[#1a2333] flex items-center justify-between px-4 bg-[#0a0f1d] shrink-0 text-xs select-none">
    <div class="flex items-center space-x-2.5">
      <img src="ico/pgh.svg" alt="Purple Grapes Harness" class="w-6 h-6 rounded shadow-sm">
      <span class="font-bold text-white tracking-wide text-xs">Purple Grapes Harness</span>
      <span class="text-slate-600">/</span>
      <!-- 工作区锁定指示 (对齐 deepseek-harness，支持在顶栏切换工作区，绝不阻塞输入区) -->
      <div class="flex items-center space-x-1.5 px-2 py-0.5 rounded bg-slate-800/80 border border-slate-700/60 font-mono text-[11px] text-blue-300">
        <span>🔒</span>
        <select id="topbar-workspace-select" onchange="handleWorkspaceChange(this.value)" class="bg-transparent text-blue-300 border-0 focus:outline-none cursor-pointer">
          <option value="">正在检测工作区...</option>
        </select>
      </div>
    </div>

    <div class="flex items-center space-x-3 text-[11px]">
      <div class="flex items-center space-x-1.5 font-mono text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded border border-slate-800">
        <span>Token: <b id="session-tokens" class="text-emerald-400">0</b></span>
        <span>·</span>
        <span>费用: <b id="session-cost" class="text-emerald-400">$0.000</b></span>
        <button
          type="button"
          onclick="resetSessionUsage()"
          title="将当前统计用量清零（记录当前基线，后续只统计新轮次，不删除历史事件）"
          class="ml-1 px-1.5 py-0.2 rounded hover:bg-slate-800 text-slate-400 hover:text-amber-300 text-[10px] transition"
        >
          🔄 清零
        </button>
      </div>
      <!-- 模型选择 -->
      <select id="topbar-model-select" class="bg-[#080d1a] border border-slate-700 rounded px-2 py-0.5 text-slate-200 font-mono text-xs focus:outline-none focus:border-blue-500">
        <option value="deepseek-chat">deepseek-chat</option>
        <option value="deepseek-reasoner">deepseek-reasoner (R1)</option>
      </select>
      <button
        type="button"
        onclick="exportSession()"
        title="导出当前会话全部对话为 Markdown"
        class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono text-[10px] flex items-center space-x-1 transition"
      >
        <span>⬇️</span><span>导出对话</span>
      </button>
      <button
        type="button"
        onclick="toggleRightPanel()"
        title="展开 / 收起右侧面板"
        class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-mono text-[10px] flex items-center space-x-1 transition"
      >
        <span>📋</span><span>面板</span>
      </button>
    </div>
  </header>

  <!-- 主体区域：左侧 48px 一级侧边栏 + 220px 二级会话树 + 主聊天窗口 -->
  <div class="flex flex-1 overflow-hidden" style="height: calc(100vh - 40px);">
    
    <!-- 全系统严格一致的 48px 一级侧边栏 -->
    <aside class="activity-bar h-full">
      <a href="run-chat.html" class="activity-btn active" title="主会话工作台 (Chat)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      </a>
      <a href="run-pipeline.html" class="activity-btn" title="角色流水线 (Pipeline)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
      </a>
      <a href="config-workspace.html" class="activity-btn" title="工作区管理与规则 (Workspaces)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
      </a>
      <a href="config-memories.html" class="activity-btn" title="记忆管理中心">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
      </a>
      <a href="config-providers.html" class="activity-btn" title="模型与Provider资产">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      </a>
      <a href="config-pipelines.html" class="activity-btn" title="流水线模板设定">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
      </a>
      <a href="config-mcp.html" class="activity-btn" title="MCP 外部服务">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
      </a>
      <a href="config-skills.html" class="activity-btn" title="Skills 技能库">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </a>
      <div class="flex-1"></div>
      <a href="config-settings.html" class="activity-btn" title="系统全局设置 (Settings)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </a>
    </aside>

    <!-- 消息对话与操作主区域 -->
    <main class="flex-1 flex flex-col justify-between overflow-hidden bg-[#070a12]">
      <!-- 消息滚动展示区 (拓宽为 max-w-6xl w-full px-6 py-4，呈现更充裕的代码与对话空间) -->
      <div id="messages-scroll-area" class="flex-1 overflow-y-auto px-6 py-4 space-y-4 max-w-6xl w-full mx-auto">
        <!-- 初始就绪空状态 (Hero Shell) -->
        <div id="chat-empty-state" class="py-16 text-center space-y-3 select-none">
          <span class="text-4xl block">⚡</span>
          <h2 class="text-base font-bold text-white">欢迎使用 Purple Grapes Harness (PGH)</h2>
          <p class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">
            极简沉浸式编码工作台已就绪。<br>
            直接在下方输入指令并按 <strong>Enter</strong> 开启对话。<br>
            具备<strong>大模型流式思考</strong>、<strong>工具自主执行</strong>与<strong>单回合 Git Checkpoint 一秒原子撤销</strong>。
          </p>
        </div>

        <!-- 动态消息流容器 -->
        <div id="messages-stream-container" class="space-y-4 hidden"></div>
      </div>

      <!-- 底部 Composer 输入面板 (同步拓宽为 max-w-6xl，提升宽屏使用体验) -->
      <div class="p-4 border-t border-[#1a2333] bg-[#0a0f1d] shrink-0">
        <div class="max-w-6xl mx-auto space-y-2">
          
          <!-- 异常诊断横幅 (代替 alert，错误即时可见) -->
          <div id="composer-error-banner" class="hidden px-3 py-2 bg-rose-950/80 border border-rose-800/80 rounded-lg text-rose-200 text-xs flex items-center justify-between">
            <span id="composer-error-text">异常信息</span>
            <button onclick="document.getElementById('composer-error-banner').classList.add('hidden')" class="text-rose-400 hover:text-white ml-2">✕</button>
          </div>

          <!-- 任务清单进度卡片 (todo_write) -->
          <div id="todo-dock" class="hidden rounded-lg border border-slate-700/70 bg-[#0b1120] px-3 py-2 space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-mono text-slate-400">📋 任务清单 <span id="todo-progress" class="text-blue-300"></span></span>
              <button type="button" onclick="toggleTodoDock()" class="text-[10px] text-slate-500 hover:text-slate-300">收起 / 展开</button>
            </div>
            <div id="todo-items" class="space-y-1 max-h-40 overflow-y-auto"></div>
          </div>

          <!-- 输入主卡片容器 -->
          <div class="border border-slate-700/80 rounded-xl bg-[#080d1a] p-3 focus-within:border-blue-500 transition shadow-inner">
            <textarea
              id="composer-textarea"
              placeholder="输入任务指令... (按 Enter 直接发送，Shift+Enter 换行)"
              rows="2"
              class="w-full bg-transparent border-0 resize-none text-xs text-white placeholder-slate-500 focus:outline-none leading-relaxed"
            ></textarea>

            <!-- 待发送附件 chips（仅 markdown 参考材料） -->
            <div id="attachment-chips" class="hidden flex-wrap gap-1.5 pt-2"></div>
            
            <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 text-xs">
              <div class="flex items-center space-x-2 text-slate-400 font-mono text-[11px]">
                <input type="file" id="attachment-input" accept=".md,text/markdown" multiple class="hidden" onchange="handleAttachmentPicked(event)">
                <button
                  type="button"
                  onclick="document.getElementById('attachment-input').click()"
                  class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 flex items-center space-x-1 transition"
                  title="添加 Markdown 参考材料（仅 .md，单个 ≤ 64KB，最多 3 个）"
                >
                  <span>📎 添加 .md</span>
                </button>
                <button
                  type="button"
                  id="revert-turn-btn"
                  onclick="triggerRevertTurn()"
                  class="px-2.5 py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 flex items-center space-x-1 transition"
                  title="撤销本回合涉及的所有代码修改，原子恢复回合前干净基线"
                >
                  <span>🔄 撤销本回合</span>
                </button>

                <!-- 授权档位（对齐 deepseek-harness 的沙箱模式选择） -->
                <select
                  id="permission-preset-select"
                  onchange="handlePermissionPresetChange(this.value)"
                  title="本会话的工具授权档位：只读 / 标准（写操作与命令需人工审批）/ 完全授权（免审批，但硬性红线仍然拒绝）"
                  class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-[11px] font-mono focus:outline-none focus:border-blue-500"
                >
                  <option value="readonly">🔒 只读</option>
                  <option value="edit">✏️ 标准（需审批）</option>
                  <option value="full">⚡ 完全授权</option>
                </select>

                <!-- 快捷选择当前可用的 Skill 并填入输入框 -->
                <div class="relative inline-block text-[11px]">
                  <select
                    id="composer-skill-select"
                    onchange="handleSelectSkillToComposer(this.value)"
                    title="选择技能快捷指令注入输入框（执行 /skill <name>）"
                    class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-900/50 text-[11px] font-mono focus:outline-none focus:border-purple-500 cursor-pointer"
                  >
                    <option value="">🧩 快捷使用 Skill...</option>
                  </select>
                </div>
              </div>

              <!-- 对齐 deepseek-harness 的 Send / Stop 二合一动态状态机按钮 -->
              <div class="flex items-center space-x-2">
                <button
                  type="button"
                  id="compact-btn"
                  onclick="triggerCompact()"
                  title="手动压缩上下文 (/compact)：将历史滚动摘要为新基线，释放窗口空间"
                  class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px] font-mono flex items-center space-x-1 transition"
                >
                  <span>🗜️</span><span>压缩上下文</span>
                </button>
                <button
                  type="button"
                  id="composer-primary-btn"
                  onclick="handlePrimaryButtonClick()"
                  class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow flex items-center space-x-1.5 transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m-7 7l7-7 7 7"></path></svg>
                  <span id="composer-primary-text">发送 (Enter)</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 右侧面板：历史会话（色块 + 悬停预览）+ 本会话轮次大纲 -->
    <aside id="right-panel" class="w-64 bg-[#0c101c] border-l border-[#1a2333] flex flex-col flex-shrink-0 transition-all duration-200">
      <!-- 面板头：标签页 + 收起按钮 -->
      <div class="border-b border-[#1a2333] flex items-center px-1 pt-1 gap-0.5">
        <button type="button" id="tab-btn-sessions" onclick="switchRightPanelTab('sessions')" class="flex-1 px-2 py-1.5 rounded-t text-[11px] font-sans border-b-2 text-blue-300 border-blue-500 bg-slate-800/50 transition">💬 会话</button>
        <button type="button" id="tab-btn-outline" onclick="switchRightPanelTab('outline')" class="flex-1 px-2 py-1.5 rounded-t text-[11px] font-sans border-b-2 text-slate-400 border-transparent bg-transparent transition">📑 大纲</button>
        <button type="button" onclick="collapseRightPanel()" class="px-2 py-1.5 text-slate-500 hover:text-slate-300 text-xs font-mono" title="收起面板">»</button>
      </div>

      <!-- 历史会话标签页：色块 + 悬停预览 -->
      <div id="right-tab-sessions" class="flex-1 flex flex-col overflow-hidden">
        <div class="p-2 border-b border-[#1a2333]">
          <button onclick="createNewSession()" class="w-full py-1.5 px-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-[11px] font-semibold flex items-center justify-center space-x-1 shadow-sm transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span>新建对话</span>
          </button>
        </div>
        <div id="session-list-container" class="flex-1 overflow-y-auto p-2 space-y-2"></div>
        <div class="p-2 border-t border-[#1a2333] text-[10px] text-slate-500 font-mono flex items-center justify-between bg-[#090d16]">
          <span>PGH Core</span>
          <span class="flex items-center text-emerald-400"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>在线</span>
        </div>
      </div>

      <!-- 本会话大纲标签页 -->
      <div id="right-tab-outline" class="flex-1 flex-col overflow-hidden hidden">
        <div class="px-2 py-1.5 border-b border-[#1a2333]">
          <span class="text-[10px] font-mono text-slate-400">轮次大纲 <span id="outline-count" class="text-blue-300">0</span></span>
        </div>
        <div id="outline-list" class="flex-1 overflow-y-auto p-1.5 space-y-1"></div>
      </div>
    </aside>

    <!-- 右侧面板收起后的展开条（在最右侧边缘，竖排提示，极其醒目防走丢） -->
    <button
      type="button"
      id="right-panel-expand"
      onclick="expandRightPanel()"
      class="hidden w-7 bg-[#0a0f1d] hover:bg-[#131b2e] border-l border-[#1a2333] text-slate-400 hover:text-blue-300 flex flex-col items-center justify-center py-4 transition group cursor-pointer"
      title="点击展开会话与大纲面板"
    >
      <span class="text-xs text-blue-400 group-hover:scale-125 transition-transform mb-2">«</span>

  </div>

  <!-- 首次启动破冰向导 (WBS-01-08-04 / D57)：冷启动两步打通端到端 -->
  <div id="wizard-modal" class="hidden fixed inset-0 z-[70] bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-lg rounded-xl bg-[#0f172a] border border-slate-700 shadow-2xl overflow-hidden flex flex-col font-sans text-xs">
      <div class="px-5 py-3.5 bg-[#131d38] border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-base">🚀</span>
          <div>
            <div class="text-sm font-bold text-white">一分钟破冰向导</div>
            <div class="text-[10px] text-slate-400">接入首个模型 + 选择首个本地项目目录</div>
          </div>
        </div>
        <span id="wizard-step-badge" class="text-[10px] font-mono text-blue-300 bg-blue-950/60 border border-blue-800/50 px-2 py-0.5 rounded">步骤 1 / 2</span>
      </div>

      <!-- 步骤 1：接入首个模型 -->
      <div id="wizard-step-1" class="p-5 space-y-3">
        <div class="p-3 rounded-lg bg-[#090d16] border border-slate-800 space-y-2.5">
          <div>
            <label class="text-slate-400 block mb-1">Provider 名称：</label>
            <input id="wizard-provider-name" type="text" value="DeepSeek" class="w-full bg-[#080d1a] border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">Base URL：</label>
            <input id="wizard-provider-baseurl" type="text" value="https://api.deepseek.com/v1" class="w-full bg-[#080d1a] border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="text-slate-400 block mb-1">API Key：</label>
            <input id="wizard-provider-key" type="password" placeholder="sk-..." class="w-full bg-[#080d1a] border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-blue-500">

            <select id="wizard-model-select" class="flex-1 bg-[#080d1a] border border-slate-700 rounded px-2 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-blue-500">
              <option value="">（可选）探测后选择模型</option>
            </select>

        <button type="button" onclick="wizardSaveProvider()" class="w-full py-2 rounded bg-blue-600 hover:bg-blue-500 text-white font-semibold">保存模型并继续 →</button>
      </div>

      <!-- 步骤 2：选择首个项目目录 -->
      <div id="wizard-step-2" class="p-5 space-y-3 hidden">
        <div class="p-3 rounded-lg bg-[#090d16] border border-slate-800 space-y-2">
          <label class="text-slate-400 block">本地项目绝对路径：</label>
          <div class="flex items-center space-x-2">
            <input id="wizard-ws-path" type="text" placeholder="例如：G:\Projects\my-app" class="flex-1 bg-[#080d1a] border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 font-mono focus:outline-none focus:border-blue-500">
            <button type="button" onclick="wizardBrowseFolder()" id="wizard-browse-btn" class="px-2.5 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 whitespace-nowrap">浏览目录…</button>
          </div>
          <span class="text-[10px] text-slate-500 block">也可稍后在「工作区治理中心」用应用内目录浏览器登记更多项目。</span>
        </div>
        <div class="flex items-center space-x-2">
          <button type="button" onclick="wizardGoStep(1)" class="px-3 py-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">← 上一步</button>
          <button type="button" onclick="wizardFinish()" class="flex-1 py-2 rounded bg-emerald-700 hover:bg-emerald-600 text-white font-semibold">完成破冰，进入工作台</button>

      <div class="px-5 py-3 bg-[#0b1120] border-t border-slate-800 flex items-center justify-between">
        <button type="button" onclick="skipWizard()" class="text-[10px] text-slate-500 hover:text-slate-300 underline">跳过向导，稍后配置</button>
        <span id="wizard-status" class="text-[10px] text-amber-400 font-mono"></span>
      </div>
    </div>
  </div>

  <script>
    let activeSessionId = null;
    let activeWorkspacePath = 'G:\\Projects\\Agent\\harness';
    let lastTurnId = null;
    let isRunning = false;
    let activeAbortController = null;
    // 待发送附件（最小版：仅 .md 参考材料，不落用户仓库）
    let pendingAttachments = [];
    const MAX_ATTACHMENTS = 3;
    const MAX_ATTACHMENT_BYTES = 64 * 1024;
    // 本会话授权档位：只读 / 标准（写操作需审批）/ 完全授权
    let activePermissionPreset = 'edit';

    /** 同步授权档位下拉框显示。 */
    function renderPermissionPreset() {
      const select = document.getElementById('permission-preset-select');
      if (select && select.value !== activePermissionPreset) select.value = activePermissionPreset;
    }

    /**
     * 切换本会话授权档位：立即落盘并记录审计事件。
     * 注意「完全授权」只免除人工审批，硬性红线（git push / 关机 / 格式化 / 根路径删除 / 敏感凭据读写）依旧拒绝。
     */
    async function handlePermissionPresetChange(value) {
      const preset = ['readonly', 'edit', 'full'].includes(value) ? value : 'edit';
      activePermissionPreset = preset;
      renderPermissionPreset();

      if (!activeSessionId) {
        // 尚未创建会话：档位会随首条消息一并提交
        if (preset === 'full') showInfoBanner('已选择「完全授权」：本会话写操作与命令将免审批执行（硬性红线仍拒绝）。');
        return;
      }

      try {
        const res = await fetch(`/api/sessions/${activeSessionId}/permission`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ preset }),
        });
        const result = await res.json();
        if (!res.ok || result.code !== 0) {
          showErrorBanner('切换授权档位失败: ' + (result.message || res.status));
          return;
        }
        if (preset === 'full') {
          showInfoBanner('已切换到「完全授权」：本会话写操作与命令免审批执行；git push / 关机 / 格式化 / 根路径删除 / 敏感凭据读写等硬性红线仍然拒绝。');
        } else if (preset === 'readonly') {
          showInfoBanner('已切换到「只读」：一切写入与命令都被拒绝。');
        } else {
          showInfoBanner('已切换到「标准」：写文件与执行命令需人工审批。');
        }
      } catch (err) {
        showErrorBanner('切换授权档位异常: ' + err.message);
      }
    }

    function renderAttachmentChips() {
      const box = document.getElementById('attachment-chips');
      box.innerHTML = '';
      if (pendingAttachments.length === 0) {
        box.className = 'hidden';
        return;
      }
      box.className = 'flex flex-wrap gap-1.5 pt-2';
      pendingAttachments.forEach((att, index) => {
        const chip = document.createElement('span');
        chip.className = 'inline-flex items-center space-x-1.5 px-2 py-1 rounded bg-slate-800 border border-slate-700 text-[11px] font-mono text-slate-300';
        chip.innerHTML = `<span>📄 ${escapeHtml(att.filename)}</span><span class="text-slate-500">${(att.bytes / 1024).toFixed(1)}KB</span><button type="button" class="text-slate-500 hover:text-rose-400" title="移除">✕</button>`;
        chip.querySelector('button').addEventListener('click', () => {
          pendingAttachments.splice(index, 1);
          renderAttachmentChips();
        });
        box.appendChild(chip);
      });
    }

    async function handleAttachmentPicked(event) {
      const files = [...(event.target.files || [])];
      event.target.value = '';
      for (const file of files) {
        if (!/\.md$/i.test(file.name)) {
          showErrorBanner(`仅支持 .md 文件：${file.name}`);
          continue;
        }
        const content = await file.text();
        const bytes = new Blob([content]).size;
        if (bytes > MAX_ATTACHMENT_BYTES) {
          showErrorBanner(`附件 ${file.name} 超过 ${Math.round(MAX_ATTACHMENT_BYTES / 1024)}KB 上限`);
          continue;
        }
        if (pendingAttachments.length >= MAX_ATTACHMENTS) {
          showErrorBanner(`单条消息最多 ${MAX_ATTACHMENTS} 个附件`);
          break;
        }
        pendingAttachments.push({ filename: file.name, content, bytes });
      }
      renderAttachmentChips();
    }

    // 1. 初始化配置 marked 代码高亮
    if (window.marked && window.hljs) {
      marked.setOptions({
        highlight: function(code, lang) {
          const language = hljs.getLanguage(lang) ? lang : 'plaintext';
          return hljs.highlight(code, { language }).value;
        },
        breaks: true,
        gfm: true,
      });
    }

    function renderMarkdown(rawMd) {
      if (!rawMd) return '';
      let html = rawMd;
      if (window.marked) {
        try {
          html = marked.parse(rawMd);
        } catch {
          html = rawMd;
        }
      }
      // 安全红线：模型输出视为不可信输入，渲染前强制消毒防 XSS
      if (window.DOMPurify) {
        try {
          return DOMPurify.sanitize(html);
        } catch {
          return html;
        }
      }
      return html;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text === undefined || text === null ? '' : text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    /** 格式化日期时间为 yyyy-MM-dd HH:mm:ss 严格标准形式。 */
    function formatDateTime(input) {
      if (!input) return '--';
      const d = typeof input === 'number' || typeof input === 'string' ? new Date(input) : input;
      if (Number.isNaN(d.getTime())) return '--';
      const pad = (n) => String(n).padStart(2, '0');
      const yyyy = d.getFullYear();
      const MM = pad(d.getMonth() + 1);
      const dd = pad(d.getDate());
      const HH = pad(d.getHours());
      const mm = pad(d.getMinutes());
      const ss = pad(d.getSeconds());
      return `${yyyy}-${MM}-${dd} ${HH}:${mm}:${ss}`;
    }

    /** 单价（美元 / token），与后端 done 事件口径保持一致。 */
    const TOKEN_UNIT_PRICE_USD = 0.000002;
    /** 当前会话的用量统计基线 seq（清零标记）：只累计 seq 大于它的 turn/completed。 */
    let activeUsageBaseline = 0;

    /** 渲染顶栏 Token 与费用（会话累计口径）。 */
    function renderUsageBar(tokens) {
      const value = Math.max(0, Number(tokens) || 0);
      const tokensEl = document.getElementById('session-tokens');
      const costEl = document.getElementById('session-cost');
      if (tokensEl) tokensEl.textContent = String(value);
      if (costEl) costEl.textContent = `$${(value * TOKEN_UNIT_PRICE_USD).toFixed(4)}`;
    }

    /** 从服务端同步当前会话的用量统计基线。 */
    async function syncUsageBaselineFromServer(sessionId) {
      try {
        const res = await fetch('/api/sessions');
        const body = await res.json();
        const record = (body.data || []).find((item) => item.id === sessionId);
        activeUsageBaseline = record && typeof record.usageBaselineSeq === 'number' ? record.usageBaselineSeq : 0;
      } catch {
        activeUsageBaseline = 0;
      }
    }

    /** 从事件集合统计「基线之后」的累计 Token（追加式事件为唯一事实来源，避免本地累加漂移）。 */
    function sumUsageFromEvents(events) {
      let sum = 0;
      for (const ev of events) {
        if (ev.type !== 'turn/completed') continue;
        if (typeof ev.seq === 'number' && ev.seq <= activeUsageBaseline) continue;
        sum += Number((ev.payload || {}).totalTokens || 0);
      }
      return sum;
    }

    /** 回合结束后按落盘事实施刷新顶栏用量。 */
    async function refreshSessionUsage() {
      if (!activeSessionId) {
        renderUsageBar(0);
        return;
      }
      try {
        const res = await fetch(`/api/sessions/${activeSessionId}/messages?after=0`);
        const result = await res.json();
        if (result.code === 0 && Array.isArray(result.data)) {
          renderUsageBar(sumUsageFromEvents(result.data));
        }
      } catch {
        // 刷新失败保留上次显示，不阻断主流程
      }
    }

    /** 手动清零当前会话的 Token / 费用统计（只重置基线，不删除历史事件）。 */
    async function resetSessionUsage() {
      if (!activeSessionId) {
        showInfoBanner('当前没有活动会话，无需清零。');
        return;
      }
      if (!confirm('确定清零当前会话的 Token 与费用统计吗？\n\n只重置统计基线，不删除任何历史事件与对话内容。')) return;
      try {
        const res = await fetch(`/api/sessions/${activeSessionId}/usage/reset`, { method: 'POST' });
        const result = await res.json();
        if (result.code === 0) {
          activeUsageBaseline = Number(result.data?.baselineSeq || 0);
          renderUsageBar(0);
          showInfoBanner('已清零：后续只统计新产生的轮次用量。');
        } else {
          showErrorBanner('清零失败: ' + result.message);
        }
      } catch (err) {
        showErrorBanner('清零请求异常: ' + err.message);
      }
    }

    /** 距底部多少像素以内算"贴底"，超过就认为用户在往上翻阅。 */
    const AUTOSCROLL_NEAR_BOTTOM_PX = 120;

    /**
     * 让消息区跟随最新内容滚动。
     * 真实可滚动容器是 `#messages-scroll-area`（overflow-y-auto），内层 stream-container 并不滚动。
     * @param force - true 时无视位置强制滚到底（用户主动发消息/切换会话）。
     */
    function scrollMessagesToBottom(force) {
      const area = document.getElementById('messages-scroll-area');
      if (!area) return;
      const distanceToBottom = area.scrollHeight - area.scrollTop - area.clientHeight;
      // 仅在用户本就贴着底部时自动跟随：否则会强行把他从历史翻阅中拽走
      if (force === true || distanceToBottom < AUTOSCROLL_NEAR_BOTTOM_PX) {
        area.scrollTop = area.scrollHeight;
      }
    }

    function showBanner(msg, tone) {
      const banner = document.getElementById('composer-error-banner');
      const text = document.getElementById('composer-error-text');
      const base = 'px-3 py-2 rounded-lg text-xs flex items-center justify-between border ';
      banner.className = base + (tone === 'info'
        ? 'bg-emerald-950/80 border-emerald-800/80 text-emerald-200'
        : 'bg-rose-950/80 border-rose-800/80 text-rose-200');
      text.textContent = msg;
    }

    function showErrorBanner(msg) {
      showBanner(msg, 'error');
    }

    function showInfoBanner(msg) {
      showBanner(msg, 'info');
    }

    function hideErrorBanner() {
      document.getElementById('composer-error-banner').classList.add('hidden');
    }

    // 2. 状态机切换：更新 Send / Stop 二合一主按钮 (对齐 deepseek-harness primaryStops)
    function setRunningState(running) {
      isRunning = running;
      const btn = document.getElementById('composer-primary-btn');
      const text = document.getElementById('composer-primary-text');
      const textarea = document.getElementById('composer-textarea');

      if (running) {
        btn.className = 'px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-semibold shadow flex items-center space-x-1.5 transition';
        text.textContent = '⏹ 停止 (Abort)';
        textarea.setAttribute('readonly', 'true');
      } else {
        btn.className = 'px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow flex items-center space-x-1.5 transition';
        text.textContent = '发送 (Enter)';
        textarea.removeAttribute('readonly');
        textarea.focus();
      }
    }

    // 3. 点击主按钮：空闲时发消息，运行态时执行 Abort 硬杀
    function handlePrimaryButtonClick() {
      if (isRunning) {
        triggerAbort();
      } else {
        handleSendMessage();
      }
    }

    // 4. 工作区与 Provider 加载初始化
    async function loadWorkspaces() {
      try {
        const res = await fetch('/api/workspaces');
        const result = await res.json();
        const select = document.getElementById('topbar-workspace-select');
        select.innerHTML = '';

        if (result.code === 0 && Array.isArray(result.data) && result.data.length > 0) {
          result.data.forEach((ws, idx) => {
            const opt = document.createElement('option');
            opt.value = ws.path;
            opt.textContent = `${ws.name} (${ws.path})`;
            if (idx === 0) {
              opt.selected = true;
              activeWorkspacePath = ws.path;
            }
            select.appendChild(opt);
          });
        } else {
          // 兜底当前目录
          const opt = document.createElement('option');
          opt.value = 'G:\\Projects\\Agent\\harness';
          opt.textContent = '当前 Harness 工程 (G:\\Projects\\Agent\\harness)';
          select.appendChild(opt);
          activeWorkspacePath = opt.value;
        }
      } catch (err) {
        console.warn('Load workspaces error:', err);
      }
    }

    function handleWorkspaceChange(val) {
      if (val) activeWorkspacePath = val;
    }

    async function loadModels() {
      try {
        const res = await fetch('/api/providers');
        const result = await res.json();
        const select = document.getElementById('topbar-model-select');

        if (result.code === 0 && Array.isArray(result.data) && result.data.length > 0) {
          select.innerHTML = '';
          result.data.forEach(p => {
            if (p.models && Array.isArray(p.models) && p.models.length > 0) {
              p.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.dataset.providerId = p.id;
                opt.textContent = `${m.id} (${p.name})`;
                select.appendChild(opt);
              });
            } else {
              const opt = document.createElement('option');
              opt.value = 'deepseek-chat';
              opt.dataset.providerId = p.id;
              opt.textContent = `deepseek-chat (${p.name})`;
              select.appendChild(opt);
            }
          });
        }
      } catch (err) {
        console.warn('Load models error:', err);
      }
    }

    // 5. 右侧历史会话：按工作区分组，每会话一个色块，悬停显示预览（ChatGPT 风格）
    async function loadSessionList() {
      try {
        const [wsRes, sessRes] = await Promise.all([
          fetch('/api/workspaces'),
          fetch('/api/sessions'),
        ]);
        const wsData = await wsRes.json();
        const sessData = await sessRes.json();

        const workspaces = (wsData.code === 0 && Array.isArray(wsData.data)) ? wsData.data : [];
        const sessions = (sessData.code === 0 && Array.isArray(sessData.data)) ? sessData.data : [];

        const container = document.getElementById('session-list-container');
        container.innerHTML = '';

        if (workspaces.length === 0 && sessions.length === 0) {
          container.innerHTML = `<div class="p-3 text-[11px] text-slate-500 italic">暂无工作区与会话</div>`;
          return;
        }

        const wsMap = new Map();
        workspaces.forEach(w => wsMap.set(w.path, { workspace: w, sessions: [] }));
        const ungrouped = [];
        sessions.forEach(s => {
          if (wsMap.has(s.workspacePath)) wsMap.get(s.workspacePath).sessions.push(s);
          else ungrouped.push(s);
        });

        for (const [wsPath, group] of wsMap.entries()) {
          const ws = group.workspace;
          const wsShort = ws.name || wsPath.split(/[\\/]/).pop() || wsPath;
          const hue = workspaceHue(wsPath);

          const groupEl = document.createElement('div');
          groupEl.className = 'space-y-1.5';
          groupEl.innerHTML = `
            <div class="flex items-center justify-between px-0.5 group cursor-pointer select-none" onclick="createSessionInWorkspace('${encodeURIComponent(wsPath)}')" title="在此工作区下新建会话">
              <div class="flex items-center space-x-1.5 text-[11px] truncate">
                <span class="w-2 h-2 rounded-sm flex-shrink-0" style="background:hsl(${hue},65%,50%)"></span>
                <span class="font-bold truncate text-slate-200">${wsShort}</span>
                <span class="text-[10px] text-slate-500 font-mono">${group.sessions.length}</span>
              </div>
              <span class="opacity-0 group-hover:opacity-100 text-blue-400 text-sm leading-none">+</span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 ws-children"></div>
          `;
          const children = groupEl.querySelector('.ws-children');
          if (group.sessions.length === 0) {
            children.innerHTML = `<div class="col-span-2 py-1 text-[10px] text-slate-600 italic text-center">空 · 点击 + 新建</div>`;
          } else {
            group.sessions.forEach(sess => children.appendChild(createSessionBlockElement(sess, hue)));
          }
          container.appendChild(groupEl);
        }

        if (ungrouped.length > 0) {
          const el = document.createElement('div');
          el.className = 'space-y-1.5 pt-2 border-t border-slate-800/60';
          el.innerHTML = `
            <div class="px-0.5 text-[10px] text-slate-500 font-semibold uppercase tracking-wider">未分组</div>
            <div class="grid grid-cols-2 gap-1.5 un-children"></div>
          `;
          const un = el.querySelector('.un-children');
          ungrouped.forEach(sess => un.appendChild(createSessionBlockElement(sess, 210)));
          container.appendChild(el);
        }
      } catch (err) {
        console.warn('Load workspace sessions failed:', err);
      }
    }

    /** 由工作区路径派生稳定色相，同一工作区色块颜色一致。 */
    function workspaceHue(wsPath) {
      let hash = 0;
      for (let i = 0; i < wsPath.length; i++) hash = (hash * 31 + wsPath.charCodeAt(i)) % 360;
      return hash;
    }

    /**
     * 会话色块（ChatGPT 风格）：平时只显示紧凑方块，悬停时弹出完整预览卡（包含标题、工作区、最后更新时间、删除按钮）。
     */
    function createSessionBlockElement(sess, hue) {
      const isActive = sess.id === activeSessionId;
      const title = sess.title || '新对话';
      const timeStr = new Date(sess.updatedAt || sess.createdAt).toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      const wsShort = (sess.workspacePath || '').split(/[\\/]/).pop() || '';
      // 提取标题前 2 个汉字或首字母缩写作为色块微标
      const badgeText = title.slice(0, 2);

      const block = document.createElement('div');
      block.className = `group relative h-11 rounded-lg cursor-pointer flex flex-col items-center justify-center transition-all duration-150 border select-none ${
        isActive ? 'border-blue-400 ring-2 ring-blue-500/30 shadow-lg scale-[1.02]' : 'border-slate-800/80 hover:border-slate-600 hover:scale-[1.02]'
      }`;
      block.style.background = `linear-gradient(135deg, hsl(${hue}, 40%, ${isActive ? 28 : 18}%), hsl(${hue}, 50%, ${isActive ? 20 : 12}%))`;

      block.innerHTML = `
        <span class="text-white font-bold text-xs tracking-tight pointer-events-none drop-shadow-sm">${escapeHtml(badgeText)}</span>
        <span class="text-[9px] text-slate-300/80 font-mono truncate px-1 max-w-[90%] pointer-events-none">${escapeHtml(title.slice(0, 4))}</span>

        <!-- 悬停浮层：外层紧贴色块边缘（无间隙，避免鼠标穿越死区导致浮层消失、删除按钮点不到），内层保留视觉间距 -->
        <div class="session-preview hidden group-hover:block absolute right-full top-0 z-50 pr-2">
          <div class="w-56 bg-[#0f172a] border border-slate-700 rounded-lg p-3 shadow-2xl text-left space-y-1.5">
            <div class="text-xs text-white font-semibold leading-snug line-clamp-2">${escapeHtml(title)}</div>
            <div class="flex items-center space-x-1 text-[10px] text-blue-300 font-mono truncate">
              <span>📁</span><span class="truncate">${escapeHtml(wsShort)}</span>
            </div>
            <div class="text-[9px] text-slate-400 font-mono">创建: ${escapeHtml(formatDateTime(sess.createdAt))}</div>
            <div class="text-[9px] text-slate-400 font-mono">更新: ${escapeHtml(formatDateTime(sess.updatedAt || sess.createdAt))}</div>
            <div class="pt-1 border-t border-slate-800 flex items-center gap-1.5">
              <button
                type="button"
                class="flex-1 px-2 py-1 text-[10px] text-slate-300 hover:text-white hover:bg-slate-700 rounded border border-slate-600 transition text-center flex items-center justify-center space-x-1 cursor-pointer"
                onclick="renameSession(event, '${sess.id}', '${escapeHtml(title).replace(/'/g, "&#39;")}')"
              >
                <span>✏️</span><span>重命名</span>
              </button>
              <button
                type="button"
                class="flex-1 px-2 py-1 text-[10px] text-rose-400 hover:text-white hover:bg-rose-600/80 rounded border border-rose-900/50 transition text-center flex items-center justify-center space-x-1 cursor-pointer"
                onclick="deleteSession(event, '${sess.id}')"
              >
                <span>🗑️</span><span>删除</span>
              </button>
            </div>
          </div>
        </div>
      `;

      // 悬停时给色块加高亮态（浮层延迟关闭，尽量避免误触丢失）
      block.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        switchSession(sess.id);
      });

      return block;
    }

    // 在指定工作区直接新建会话
    function createSessionInWorkspace(encodedPath) {
      const targetPath = decodeURIComponent(encodedPath);
      activeWorkspacePath = targetPath;
      const select = document.getElementById('topbar-workspace-select');
      if (select) select.value = targetPath;
      createNewSession();
    }

    async function renameSession(event, sessionId, currentTitle) {
      if (event) event.stopPropagation();
      const next = prompt('请输入会话新标题：', currentTitle || '');
      if (next === null) return;
      const trimmed = next.trim();
      if (!trimmed) {
        showErrorBanner('会话标题不能为空');
        return;
      }
      try {
        const res = await fetch(`/api/sessions/${sessionId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: trimmed }),
        });
        const result = await res.json();
        if (result.code === 0) {
          if (activeSessionId === sessionId) {
            const titleEl = document.getElementById('active-session-title');
            if (titleEl) titleEl.textContent = trimmed;
          }
          await loadSessionList();
        } else {
          showErrorBanner('重命名失败: ' + result.message);
        }
      } catch (err) {
        showErrorBanner('重命名请求异常: ' + err.message);
      }
    }

    async function deleteSession(event, sessionId) {
      event.stopPropagation();
      if (!confirm('确定要删除该会话及其所有历史事件吗？此操作不可逆。')) return;

      try {
        const res = await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.code === 0) {
          if (activeSessionId === sessionId) {
            createNewSession();
          } else {
            await loadSessionList();
          }
        } else {
          showErrorBanner('删除会话失败: ' + result.message);
        }
      } catch (err) {
        showErrorBanner('删除请求异常: ' + err.message);
      }
    }

    function createNewSession() {
      activeSessionId = null;
      lastTurnId = null;
      lastKnownSeq = 0;
      activeUsageBaseline = 0;
      stopSessionWatch();
      // 新会话回到安全的默认档位（标准：写操作需审批），避免沿用上一次的"完全授权"
      activePermissionPreset = 'edit';
      renderPermissionPreset();
      renderUsageBar(0);
      const titleEl = document.getElementById('active-session-title');
      if (titleEl) titleEl.textContent = '新对话';
      // 清空右侧轮次大纲
      outlineTurns = [];
      renderTurnOutline();
      document.getElementById('chat-empty-state').classList.remove('hidden');
      const streamBox = document.getElementById('messages-stream-container');
      streamBox.classList.add('hidden');
      streamBox.innerHTML = '';
      loadSessionList();
    }

    async function switchSession(sessionId) {
      activeSessionId = sessionId;
      await loadSessionList();
      await syncPermissionPresetFromServer(sessionId);
      await syncUsageBaselineFromServer(sessionId);

      try {
        const res = await fetch(`/api/sessions/${sessionId}/messages?after=0`);
        const result = await res.json();
        if (result.code !== 0 || !Array.isArray(result.data)) {
          showErrorBanner('加载会话历史失败。');
          return;
        }
        renderConversation(result.data);
        renderUsageBar(sumUsageFromEvents(result.data));
        startSessionWatch(sessionId);
      } catch (err) {
        console.error('Switch session error:', err);
        showErrorBanner('加载会话历史异常: ' + err.message);
      }
    }

    /** 从服务端同步指定会话的授权档位（切换会话时保证界面与后端一致）。 */
    async function syncPermissionPresetFromServer(sessionId) {
      try {
        const res = await fetch('/api/sessions');
        const body = await res.json();
        const record = (body.data || []).find((item) => item.id === sessionId);
        if (record && typeof record.preset === 'string' && ['readonly', 'edit', 'full'].includes(record.preset)) {
          activePermissionPreset = record.preset;
        }
      } catch {
        // 同步失败不阻断会话切换，保留当前档位显示
      }
      renderPermissionPreset();
    }

    // ---------- 右侧面板 (会话色块列表 + 轮次大纲) ----------
    let outlineTurns = [];
    let rightPanelTab = 'sessions';

    function switchRightPanelTab(tab) {
      rightPanelTab = tab;
      const tabSessions = document.getElementById('right-tab-sessions');
      const tabOutline = document.getElementById('right-tab-outline');
      const btnSessions = document.getElementById('tab-btn-sessions');
      const btnOutline = document.getElementById('tab-btn-outline');
      const activeCls = ['text-blue-300', 'border-blue-500', 'bg-slate-800/50'];
      const idleCls = ['text-slate-400', 'border-transparent', 'bg-transparent'];

      tabSessions.classList.toggle('hidden', tab !== 'sessions');
      tabSessions.classList.toggle('flex', tab === 'sessions');
      tabOutline.classList.toggle('hidden', tab !== 'outline');
      tabOutline.classList.toggle('flex', tab === 'outline');

      btnSessions.className = btnSessions.className.replace(/\b(text-\S+|border-\S+|bg-\S+)\b/g, '').trim();
      btnOutline.className = btnOutline.className.replace(/\b(text-\S+|border-\S+|bg-\S+)\b/g, '').trim();
      const target = tab === 'sessions' ? btnSessions : btnOutline;
      const other = tab === 'sessions' ? btnOutline : btnSessions;
      target.classList.add(...activeCls);
      other.classList.add(...idleCls);
    }

    function collapseRightPanel() {
      const panel = document.getElementById('right-panel');
      const strip = document.getElementById('right-panel-expand');
      if (panel) panel.classList.add('hidden');
      if (strip) { strip.classList.remove('hidden'); strip.classList.add('flex'); }
    }

    function expandRightPanel() {
      const panel = document.getElementById('right-panel');
      const strip = document.getElementById('right-panel-expand');
      if (panel) panel.classList.remove('hidden');
      if (strip) { strip.classList.add('hidden'); strip.classList.remove('flex'); }
    }

    function toggleRightPanel() {
      const panel = document.getElementById('right-panel');
      if (!panel) return;
      if (panel.classList.contains('hidden')) expandRightPanel();
      else collapseRightPanel();
    }

    /** 渲染右侧轮次大纲列表。 */
    function renderTurnOutline() {
      const list = document.getElementById('outline-list');
      const count = document.getElementById('outline-count');
      if (!list) return;
      if (count) count.textContent = String(outlineTurns.length);

      if (outlineTurns.length === 0) {
        list.innerHTML = '<div class="p-3 text-[11px] text-slate-500 italic">本会话暂无对话轮次</div>';
        return;
      }

      list.innerHTML = '';
      outlineTurns.forEach((turn, index) => {
        const question = String(turn.user || '(无提问)').replace(/\s+/g, ' ').trim();
        const preview = question.length > 42 ? `${question.slice(0, 42)}…` : question;
        const toolCount = Array.isArray(turn.tools) ? turn.tools.filter((item) => item.kind === 'call').length : 0;
        const meta = [
          toolCount > 0 ? `🔧 ${toolCount}` : '',
          turn.steps ? `${turn.steps} 步` : '',
          turn.totalTokens ? `${turn.totalTokens} tokens` : '',
          turn.stoppedReason && turn.stoppedReason !== 'completed' ? turn.stoppedReason : '',
        ].filter(Boolean).join(' · ');
        const turnTimeStr = formatDateTime(turn.startedAt || turn.completedAt);

        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'w-full text-left px-2.5 py-2 rounded-lg border border-transparent hover:border-slate-700 hover:bg-slate-800/50 transition space-y-0.5';
        item.innerHTML = `
          <div class="flex items-center justify-between text-[10px] font-mono text-slate-500">
            <span>第 ${index + 1} 轮</span>
            <span class="truncate max-w-[80px]">${escapeHtml(String(turn.model || ''))}</span>
          </div>
          <div class="text-[11px] text-slate-300 leading-snug">${escapeHtml(preview)}</div>
          ${meta ? `<div class="text-[10px] text-slate-400 font-mono">${escapeHtml(meta)}</div>` : ''}
          <div class="text-[9px] text-slate-500 font-mono flex items-center space-x-1 pt-0.5">
            <span>🕒</span><span>${escapeHtml(turnTimeStr)}</span>
          </div>
        `;
        item.addEventListener('click', () => jumpToTurn(turn.turnId, item));
        list.appendChild(item);
      });
    }

    /** 点击大纲条目跳转到对应轮次，并高亮当前项。 */
    function jumpToTurn(turnId, item) {
      if (!turnId) return;
      const target = document.querySelector(`[data-turn-id="${turnId}"]`);
      if (!target) {
        showErrorBanner('该轮次不在当前视图中。');
        return;
      }
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const list = document.getElementById('outline-list');
      if (list) {
        list.querySelectorAll('button').forEach((el) => el.classList.remove('bg-slate-800/70', 'border-blue-600/50'));
      }
      if (item) item.classList.add('bg-slate-800/70', 'border-blue-600/50');
    }

    /** 回合结束后从服务端重取事件，保证大纲与落盘事实一致（单一数据来源，避免增量维护漂移）。 */
    async function refreshTurnOutline() {
      if (!activeSessionId) {
        outlineTurns = [];
        renderTurnOutline();
        return;
      }
      try {
        const res = await fetch(`/api/sessions/${activeSessionId}/messages?after=0`);
        const result = await res.json();
        if (result.code === 0 && Array.isArray(result.data)) {
          outlineTurns = groupTurns(result.data);
          renderTurnOutline();
        }
      } catch {
        // 大纲刷新失败不影响主流程
      }
    }

    // ---------- 逐轮对话渲染与操作 (模型标注 / 点赞点踩 / 重做 / 导出) ----------

    function groupTurns(events) {
      const turns = [];
      const byId = new Map();
      for (const ev of events) {
        if (!ev.turnId) continue;
        let turn = byId.get(ev.turnId);
        if (!turn) {
          turn = { turnId: ev.turnId, user: '', assistant: '', model: '', tools: [], attachments: [], questions: [], answers: [], approvals: [], decisions: [], todos: null, feedback: null, steps: 0, stoppedReason: '', startedAt: 0, completedAt: 0, inputTokens: 0, outputTokens: 0, totalTokens: 0 };
          byId.set(ev.turnId, turn);
          turns.push(turn);
        }
        // 每轮起始时间取该轮首条事件时间（事件日志 created_at 为唯一事实来源）
        if (typeof ev.createdAt === 'number' && (turn.startedAt === 0 || ev.createdAt < turn.startedAt)) {
          turn.startedAt = ev.createdAt;
        }
        if (typeof ev.createdAt === 'number' && ev.createdAt > turn.completedAt) {
          turn.completedAt = ev.createdAt;
        }
        if (ev.type === 'message/user') {
          turn.user = String((ev.payload || {}).content || '');
        } else if (ev.type === 'message/attachment') {
          turn.attachments.push(String((ev.payload || {}).filename || ''));
        } else if (ev.type === 'question_asked') {
          turn.questions.push(ev.payload || {});
        } else if (ev.type === 'question_answered') {
          turn.answers.push(ev.payload || {});
        } else if (ev.type === 'approval/requested') {
          turn.approvals.push(ev.payload || {});
        } else if (ev.type === 'approval/resolved') {
          turn.decisions.push(ev.payload || {});
        } else if (ev.type === 'message/assistant') {
          turn.assistant = String((ev.payload || {}).content || '');
          if ((ev.payload || {}).model) turn.model = String(ev.payload.model);
        } else if (ev.type === 'tool/call') {
          turn.tools.push({ kind: 'call', tool: String((ev.payload || {}).tool || ''), args: (ev.payload || {}).args });
        } else if (ev.type === 'tool/result') {
          turn.tools.push({ kind: 'result', output: String((ev.payload || {}).output || ''), isError: Boolean((ev.payload || {}).isError), meta: (ev.payload || {}).meta });
        } else if (ev.type === 'todo/update') {
          turn.todos = Array.isArray((ev.payload || {}).todos) ? ev.payload.todos : null;
        } else if (ev.type === 'turn/completed') {
          turn.steps = Number((ev.payload || {}).stepsUsed || 0);
          turn.stoppedReason = String((ev.payload || {}).stoppedReason || '');
          const p = ev.payload || {};
          if (typeof p.inputTokens === 'number') turn.inputTokens = p.inputTokens;
          if (typeof p.outputTokens === 'number') turn.outputTokens = p.outputTokens;
          if (typeof p.totalTokens === 'number') turn.totalTokens = p.totalTokens;
        } else if (ev.type === 'message/feedback') {
          turn.feedback = String((ev.payload || {}).rating || '');
        }
      }
      return turns.filter((t) => t.user || t.assistant);
    }

    function renderConversation(events) {
      const streamBox = document.getElementById('messages-stream-container');
      const emptyState = document.getElementById('chat-empty-state');
      const turns = groupTurns(events);

      // 记录已消费到的最大 seq，供长期订阅按增量续传
      for (const event of events) {
        if (typeof event.seq === 'number') lastKnownSeq = Math.max(lastKnownSeq, event.seq);
      }

      streamBox.innerHTML = '';
      if (turns.length === 0) {
        emptyState.classList.remove('hidden');
        streamBox.classList.add('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      streamBox.classList.remove('hidden');

      const lastTurn = turns[turns.length - 1];
      lastTurnId = lastTurn ? lastTurn.turnId : null;

      // 1. 恢复最后一轮使用的模型为顶栏下拉框选中的模型
      if (lastTurn && lastTurn.model) {
        const select = document.getElementById('topbar-model-select');
        if (select) {
          const matched = Array.from(select.options).find(opt => opt.value === lastTurn.model);
          if (matched) {
            select.value = lastTurn.model;
          }
        }
      }

      for (const turn of turns) {
        if (turn.user) appendUserBubble(turn.user, turn.attachments, turn.startedAt);
        const card = createAssistantCard(turn.turnId, turn.model, Boolean(lastTurn) && turn.turnId === lastTurn.turnId);
        // 回填该轮的产出时间与真实 Token 消耗（来自落盘 turn/completed 事件，非估算）
        card.setMeta({ createdAt: turn.startedAt, inputTokens: turn.inputTokens, outputTokens: turn.outputTokens, totalTokens: turn.totalTokens });

        // 历史会话默认将工具调用、输出及 Diff 细节折叠收缩（details 包裹），点击才展开查看
        if (turn.tools && turn.tools.length > 0) {
          const details = document.createElement('details');
          details.className = 'group border border-slate-800/80 bg-[#090d18] rounded-lg p-2 text-xs space-y-1 my-1 transition';
          
          const toolCallCount = turn.tools.filter(t => t.kind === 'call' && t.tool !== 'ask_user').length;
          const summary = document.createElement('summary');
          summary.className = 'cursor-pointer select-none text-[11px] font-mono text-slate-400 group-hover:text-blue-300 flex items-center justify-between list-none';
          summary.innerHTML = `
            <span class="flex items-center space-x-1.5">
              <span>🔧 工具执行轨迹 (${toolCallCount} 次调用)</span>
            </span>
            <span class="text-[10px] text-slate-500 group-open:rotate-180 transition-transform">▼</span>
          `;
          details.appendChild(summary);

          const toolBody = document.createElement('div');
          toolBody.className = 'pt-2 space-y-1 border-t border-slate-800/60 mt-1.5';

          for (const tool of turn.tools) {
            if (tool.kind === 'call' && tool.tool === 'ask_user') continue;
            const line = document.createElement('div');
            if (tool.kind === 'call') {
              line.className = 'text-[11px] font-mono text-amber-300/90 bg-amber-950/20 border border-amber-900/30 rounded px-2.5 py-1 my-1';
              line.textContent = `🔧 执行工具: ${tool.tool} ${JSON.stringify(tool.args || {})}`;
            } else {
              line.className = `text-[11px] font-mono rounded px-2.5 py-1 my-0.5 ${tool.isError ? 'text-rose-300 bg-rose-950/20 border border-rose-900/30' : 'text-emerald-300/90 bg-emerald-950/20 border border-emerald-900/30'}`;
              line.textContent = `📥 工具输出 (${tool.output.length} 字符)${tool.isError ? ' [报错]' : ''}`;
            }
            toolBody.appendChild(line);
          }

          // 行级 Diff 审阅卡（红绿对比）放进折叠区内
          for (const tool of turn.tools) {
            if (tool.kind === 'result' && tool.meta && Array.isArray(tool.meta.lines)) {
              toolBody.appendChild(createDiffCard(tool.meta));
            }
          }

          details.appendChild(toolBody);
          card.toolsEl.appendChild(details);
        }

        for (const question of turn.questions) {
          const answered = turn.answers.find((entry) => entry.requestID === question.requestID);
          card.toolsEl.appendChild(createQuestionCard(question, answered || null));
        }

        for (const approval of turn.approvals) {
          const decided = turn.decisions.find((entry) => entry.requestID === approval.requestID);
          card.toolsEl.appendChild(createApprovalCard(approval, decided || null));
        }

        if (turn.assistant) {
          card.contentEl.className = 'prose-dark leading-relaxed font-sans';
          card.contentEl.innerHTML = renderMarkdown(turn.assistant);
        } else {
          card.contentEl.textContent = '(本轮未产生文本回答)';
          card.contentEl.className = 'text-slate-500 italic leading-relaxed font-sans';
        }
        if (turn.feedback) card.setFeedback(turn.feedback);

        streamBox.appendChild(card.el);
      }

      // 渲染完毕后强制拉到底部最新一条对话 (force=true)，杜绝跳回第一条
      scrollMessagesToBottom(true);
      requestAnimationFrame(() => scrollMessagesToBottom(true));
      setTimeout(() => scrollMessagesToBottom(true), 50);

      // 任务清单卡片回放：取整个会话最后一次 todo/update
      const latestTodos = [...turns].reverse().find((turn) => turn.todos)?.todos ?? null;
      renderTodoDock(latestTodos);

      // 右侧轮次大纲与当前会话保持一致
      outlineTurns = turns;
      renderTurnOutline();
    }

    /**
     * 将 Markdown 文本中各级标题统一降级，保证其级别严格低于包裹层级。
     * 例如基础层级为 2（## 助手），内容中的一级标题 # 降为 ###，## 降为 ####，以此类推；
     * 并在代码块内部（``` 或 ~~~）跳过，防止污染代码注释。
     */
    function demoteMarkdownHeadings(content, baseLevel = 2) {
      if (!content || typeof content !== 'string') return '';
      const lines = content.split('\n');
      let inCodeBlock = false;
      let codeFence = '';

      const demoted = lines.map((line) => {
        const fenceMatch = line.match(/^(\s*)(`{3,}|~{3,})/);
        if (fenceMatch) {
          if (!inCodeBlock) {
            inCodeBlock = true;
            codeFence = fenceMatch[2][0];
          } else if (fenceMatch[2][0] === codeFence) {
            inCodeBlock = false;
            codeFence = '';
          }
          return line;
        }

        if (inCodeBlock) return line;

        // 匹配未被代码块包裹的标题行 (#+ 后面跟随空格或末尾)
        const headingMatch = line.match(/^(#{1,6})(\s+.*)$/);
        if (headingMatch) {
          const currentHashes = headingMatch[1];
          const rest = headingMatch[2];
          // 降级：增加 baseLevel 个 '#'，Markdown 最大建议层级 6（超过也合规渲染）
          const newHashes = '#'.repeat(currentHashes.length + baseLevel);
          return `${newHashes}${rest}`;
        }

        return line;
      });

      return demoted.join('\n');
    }

    function turnsToMarkdown(turns, title) {
      const lines = [`# ${title}`, '', `> 导出时间：${new Date().toLocaleString()}`, ''];
      turns.forEach((turn, idx) => {
        lines.push(`## 轮次 ${idx + 1}`);
        lines.push('');

        if (turn.user) {
          lines.push('### 👤 用户输入', '');
          lines.push(demoteMarkdownHeadings(turn.user, 3), '');
        }
        if (turn.attachments && turn.attachments.length > 0) {
          lines.push(`> 附加参考材料：${turn.attachments.map((n) => `\`${n}\``).join('、')}`, '');
        }
        if (turn.tools && turn.tools.length > 0) {
          lines.push('<details><summary>工具调用轨迹</summary>', '');
          for (const tool of turn.tools) {
            if (tool.kind === 'call') {
              lines.push(`- 🔧 \`${tool.tool}\` ${JSON.stringify(tool.args || {})}`);
            } else {
              lines.push(`- 📥 ${tool.isError ? '[失败] ' : ''}${String(tool.output).slice(0, 300).replace(/\n/g, ' ')}`);
            }
          }
          lines.push('', '</details>', '');
        }
        if (turn.assistant) {
          lines.push(`### 🤖 助手回答${turn.model ? ` · 模型：${turn.model}` : ''}`, '');
          // 助手回答从属于 ###，内部内容标题降级为 #### 开始 (baseLevel=3)
          lines.push(demoteMarkdownHeadings(turn.assistant, 3), '');
        }
        if (turn.feedback) {
          lines.push(`> 本轮评价：${turn.feedback === 'up' ? '👍 答得好' : '👎 有待加强'}`, '');
        }
        lines.push('---', '');
      });
      return lines.join('\n');
    }

    function downloadMarkdown(filename, content) {
      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    async function fetchSessionTurns() {
      if (!activeSessionId) return [];
      const res = await fetch(`/api/sessions/${activeSessionId}/messages?after=0`);
      const result = await res.json();
      if (result.code !== 0 || !Array.isArray(result.data)) return [];
      return groupTurns(result.data);
    }

    async function exportSession() {
      const turns = await fetchSessionTurns();
      if (turns.length === 0) {
        showErrorBanner('当前会话暂无可导出的对话内容。');
        return;
      }
      downloadMarkdown(`pgh-session-${Date.now()}.md`, turnsToMarkdown(turns, 'Purple Grapes Harness 会话导出'));
    }

    async function exportTurn(turnId) {
      if (!turnId) {
        showErrorBanner('本轮对话尚未落盘，暂时无法导出。');
        return;
      }
      const turns = await fetchSessionTurns();
      const target = turns.find((t) => t.turnId === turnId);
      if (!target) {
        showErrorBanner('未找到该轮对话内容。');
        return;
      }
      downloadMarkdown(`pgh-turn-${turnId}.md`, turnsToMarkdown([target], 'Purple Grapes Harness 单轮对话导出'));
    }

    /**

      el.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-800/60 pb-2">
          <span class="font-bold text-purple-400 font-mono text-[11px] flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span>
            <span>PGH AGENT</span>
          </span>
          <span class="text-[10px] text-slate-500 font-mono flex items-center gap-2">
            <span data-role="created-time" title="本回合启动时间">🕒 <span data-role="created-time-text">--</span></span>
            <span>已捕获 Git 检查点 🔒</span>
          </span>
        </div>
        <div data-role="reasoning-box" class="hidden border border-purple-900/40 rounded bg-[#090d18] p-2.5 text-xs font-mono">
          <div data-role="reasoning-toggle" class="flex items-center justify-between text-purple-300 text-[11px] cursor-pointer select-none">

          </div>
          <div data-role="reasoning-content" class="pt-2 text-[11px] text-purple-200/80 border-t border-purple-950/60 mt-1.5 whitespace-pre-wrap leading-relaxed font-mono"></div>
        </div>
        <div data-role="tools" class="space-y-1"></div>
        <div data-role="content" class="prose-dark leading-relaxed font-sans"><span class="text-slate-500 animate-pulse">正在调度智能体引擎处理...</span></div>
        <div class="pt-2 border-t border-slate-800/60 space-y-1">

          <div data-role="usage-line" class="text-[10px] text-slate-500 font-mono">本轮消耗：-- （回合结束后统计）</div>

            <button type="button" data-act="down" title="有待加强（点踩）" class="px-1.5 py-0.5 rounded hover:bg-slate-800 text-slate-500 hover:text-rose-400 transition text-[11px]">👎</button>
            ${isLast ? '<button type="button" data-act="redo" title="重做本轮（重新请求模型）" class="px-1.5 py-0.5 rounded hover:bg-slate-800 text-slate-500 hover:text-blue-400 transition text-[11px]">🔄</button>' : ''}
            <button type="button" data-act="export" title="导出本轮对话" class="px-1.5 py-0.5 rounded hover:bg-slate-800 text-slate-500 hover:text-slate-300 transition text-[11px]">⬇️</button>
          </div>
