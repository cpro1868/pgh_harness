      const contentEl = el.querySelector('[data-role="content"]');
      const toolsEl = el.querySelector('[data-role="tools"]');
      const reasoningBox = el.querySelector('[data-role="reasoning-box"]');
      const reasoningContent = el.querySelector('[data-role="reasoning-content"]');
      const modelLine = el.querySelector('[data-role="model-line"]');
      const usageLine = el.querySelector('[data-role="usage-line"]');
      const createdTimeText = el.querySelector('[data-role="created-time-text"]');
      const upBtn = el.querySelector('[data-act="up"]');
      const downBtn = el.querySelector('[data-act="down"]');
      const redoBtn = el.querySelector('[data-act="redo"]');
      el.querySelector('[data-role="reasoning-toggle"]').addEventListener('click', () => reasoningBox.classList.toggle('hidden'));

      const idleBtn = 'px-1.5 py-0.5 rounded hover:bg-slate-800 transition text-[11px] ';
      const controller = {
        el,
        contentEl,
        toolsEl,
        reasoningBox,
        reasoningContent,
        turnId: turnId || null,
        model: model || '',
        setTurnId(id) {
          if (!id) return;
          controller.turnId = id;
          el.dataset.turnId = id;
        },
        setModel(name) {
          if (!name) return;
          controller.model = name;
          modelLine.textContent = `模型：${name}`;
        },
        /**
         * 回填该回合的产出时间与真实 Token 消耗。
         * @param meta createdAt / inputTokens / outputTokens / totalTokens（缺失字段自动回退 0）
         */
        setMeta(meta) {
          const m = meta || {};
          if (typeof m.createdAt === 'number' && m.createdAt > 0) {
            createdTimeText.textContent = formatDateTime(m.createdAt);
          }
          const input = Number(m.inputTokens || 0);
          const output = Number(m.outputTokens || 0);
          const total = Number(m.totalTokens || 0);
          if (total > 0 || input > 0 || output > 0) {
            usageLine.innerHTML = `本轮消耗：↑ 输入 <span class="text-sky-300">${input}</span> · ↓ 输出 <span class="text-emerald-300">${output}</span> · Σ 合计 <span class="text-amber-300">${total}</span>`;
          } else {
            usageLine.textContent = '本轮消耗：--（未上报 token 用量）';
          }
        },
        setFeedback(rating) {
          upBtn.className = idleBtn + (rating === 'up' ? 'bg-slate-800 text-emerald-400' : 'text-slate-500 hover:text-emerald-400');
          downBtn.className = idleBtn + (rating === 'down' ? 'bg-slate-800 text-rose-400' : 'text-slate-500 hover:text-rose-400');
        },
      };

      upBtn.addEventListener('click', () => handleFeedback(controller, 'up'));
      downBtn.addEventListener('click', () => handleFeedback(controller, 'down'));
      if (redoBtn) redoBtn.addEventListener('click', () => handleRedo(controller));
      el.querySelector('[data-act="export"]').addEventListener('click', () => exportTurn(controller.turnId));

      return controller;
    }

    async function handleFeedback(controller, rating) {
      if (!activeSessionId || !controller.turnId) {
        showErrorBanner('本轮对话尚未完成，暂时无法评价。');
        return;
      }
      try {
        const res = await fetch(`/api/sessions/${activeSessionId}/feedback`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ turnId: controller.turnId, rating }),
        });
        const result = await res.json();
        if (result.code !== 0) {
          showErrorBanner('反馈提交失败: ' + result.message);
          return;
        }
        controller.setFeedback(rating);
      } catch (err) {
        showErrorBanner('反馈请求异常: ' + err.message);
      }
    }

    async function handleRedo(controller) {
      if (isRunning) {
        showErrorBanner('请先等待当前回合结束或中止后再重做。');
        return;
      }
      if (!activeSessionId || !controller.turnId) {
        showErrorBanner('暂无可重做的回合。');
        return;
      }
      if (!confirm('重做将清除本轮回答并重新请求模型，确定继续吗？')) return;

      try {
        const res = await fetch(`/api/sessions/${activeSessionId}/redo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ turnId: controller.turnId }),
        });
        const result = await res.json();
        if (result.code !== 0) {
          showErrorBanner('重做失败: ' + result.message);
          return;
        }

        const streamBox = document.getElementById('messages-stream-container');
        controller.el.remove();
        lastTurnId = null;

        const modelId = document.getElementById('topbar-model-select').value || 'deepseek-chat';
        const card = createAssistantCard(null, modelId, true);
        streamBox.appendChild(card.el);
        scrollMessagesToBottom();

        await runStream(result.data.message, modelId, card, result.data.attachments || []);
      } catch (err) {
        showErrorBanner('重做请求异常: ' + err.message);
      }
    }

    /**
     * 渲染人机提问卡片（TC-01-04-006）。
     * @param payload - question_asked 事件载荷。
     * @param answered - 已有应答（回放时提供），为空表示等待回答。
     */
    function createQuestionCard(payload, answered) {
      const requestId = String(payload.requestID || '');
      const questions = Array.isArray(payload.questions) ? payload.questions : [];
      const resolved = answered || null;

      const card = document.createElement('div');
      card.className = 'p-3 rounded-xl bg-purple-950/20 border border-purple-800/50 text-xs space-y-2 font-sans my-1';

      const head = document.createElement('div');
      head.className = 'flex items-center justify-between';
      const stateText = resolved
        ? (resolved.action === 'reply' ? `已回答：${(resolved.answers || []).join('、')}` : '已驳回，模型自行兜底')
        : '等待回答';
      head.innerHTML = `
        <span class="font-bold text-purple-300 font-mono text-[11px]">❓ 需要你确认（${escapeHtml(requestId.slice(0, 13))}…）</span>
        <span class="text-[10px] ${resolved ? 'text-slate-500' : 'text-amber-400'} font-mono">${escapeHtml(stateText)}</span>`;
      card.appendChild(head);

      const inputs = [];
      questions.forEach((prompt) => {
        const block = document.createElement('div');
        block.className = 'space-y-1';

        const title = document.createElement('div');
        title.className = 'text-slate-200 font-medium';
        title.textContent = `${prompt.header ? `${prompt.header}：` : ''}${prompt.question || ''}`;
        block.appendChild(title);

        const options = Array.isArray(prompt.options) ? prompt.options : [];
        const groupName = `q-${requestId}-${prompt.id || 'x'}`;
        options.forEach((option) => {
          const label = document.createElement('label');
          label.className = 'flex items-start space-x-2 text-slate-300 cursor-pointer';
          label.innerHTML = `<input type="${prompt.multiple ? 'checkbox' : 'radio'}" name="${escapeHtml(groupName)}" value="${escapeHtml(option.label)}" class="mt-0.5 rounded bg-slate-900 border-slate-700 text-purple-500">
            <span><b class="text-slate-200">${escapeHtml(option.label)}</b>${option.description ? `<span class="text-slate-500"> · ${escapeHtml(option.description)}</span>` : ''}</span>`;
          block.appendChild(label);
        });

        const free = document.createElement('input');
        free.type = 'text';
        free.placeholder = options.length > 0 ? '补充说明（可选）' : '请输入你的回答';
        free.className = 'w-full bg-[#080d1a] border border-slate-700 rounded px-2 py-1 text-[11px] text-slate-200 focus:outline-none focus:border-purple-500';
        block.appendChild(free);

        inputs.push({ prompt, free, groupName });
        card.appendChild(block);
      });

      const actions = document.createElement('div');
      actions.className = 'flex items-center space-x-2 pt-1';
      card.appendChild(actions);

      const settle = (label) => {
        actions.innerHTML = `<span class="text-[10px] text-slate-500 font-mono">${escapeHtml(label)}</span>`;
        card.querySelectorAll('input, button').forEach((el) => { el.disabled = true; });
      };

      if (resolved) {
        settle(stateText);
        return card;
      }

      actions.innerHTML = `
        <button type="button" data-act="reply" class="px-2.5 py-1 rounded bg-purple-700 hover:bg-purple-600 text-white text-[11px] font-semibold">提交回答</button>
        <button type="button" data-act="reject" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-[11px]">驳回 / 忽略</button>`;

      const collectAnswers = () => {
        const answers = [];
        for (const { prompt, free, groupName } of inputs) {
          const typed = free.value.trim();
          if (typed) {
            answers.push(typed);
            continue;
          }
          card.querySelectorAll(`input[name="${groupName}"]:checked`).forEach((el) => {
            if (el.value) answers.push(el.value);
          });
        }
        return answers;
      };

      const submit = async (action, body, label) => {
        try {
          const res = await fetch(`/api/questions/${encodeURIComponent(requestId)}/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const result = await res.json();
          if (!res.ok || result.code !== 0) {
            showErrorBanner('应答失败: ' + (result.message || res.status));
            return;
          }
          settle(label);
        } catch (err) {
          showErrorBanner('应答请求异常: ' + err.message);
        }
      };

      actions.querySelector('[data-act="reply"]').addEventListener('click', () => {
        const answers = collectAnswers();
        if (answers.length === 0) {
          showErrorBanner('请先选择一个选项或填写回答。');
          return;
        }
        void submit('reply', { answers }, `已回答：${answers.join('、')}`);
      });
      actions.querySelector('[data-act="reject"]').addEventListener('click', () => {
        void submit('reject', { reason: '用户在界面上驳回' }, '已驳回，模型将自主兜底');
      });

      return card;
    }

    /**
     * 渲染破坏性操作审批卡片（设计 §6.3；超时与拒绝同为 fail-closed）。
     * @param payload - approval/requested 事件载荷。
     * @param resolved - 已有裁决（回放时提供）。
     */
    function createApprovalCard(payload, resolved) {
      const requestId = String(payload.requestID || '');
      const tool = String(payload.tool || '');
      const args = payload.args && typeof payload.args === 'object' ? payload.args : {};

      const card = document.createElement('div');
      card.className = 'p-3 rounded-xl bg-amber-950/20 border border-amber-800/50 text-xs space-y-2 font-sans my-1';

      const stateText = resolved
        ? (resolved.decision === 'allow' ? '已批准' : `已拒绝${resolved.reason ? `：${resolved.reason}` : ''}`)
        : '等待裁决（超时按拒绝处理）';

      const head = document.createElement('div');
      head.className = 'flex items-center justify-between';
      head.innerHTML = `
        <span class="font-bold text-amber-300 font-mono text-[11px]">⚠️ 需要授权（${escapeHtml(requestId.slice(0, 13))}…）</span>
        <span class="text-[10px] ${resolved ? 'text-slate-500' : 'text-amber-400'} font-mono">${escapeHtml(stateText)}</span>`;
      card.appendChild(head);

      const body = document.createElement('div');
      body.className = 'space-y-1';
      body.innerHTML = `
        <div class="text-slate-200"><b>工具</b>：<code class="text-amber-200">${escapeHtml(tool)}</code></div>
        <div class="text-slate-400 font-mono text-[11px] break-all bg-[#090d18] border border-slate-800 rounded px-2 py-1">${escapeHtml(JSON.stringify(args))}</div>
        <div class="text-slate-500 text-[11px]">${escapeHtml(String(payload.reason || ''))}</div>`;
      card.appendChild(body);

      const actions = document.createElement('div');
      actions.className = 'flex items-center space-x-2 pt-1';
      card.appendChild(actions);

      const settle = (label) => {
        actions.innerHTML = `<span class="text-[10px] text-slate-500 font-mono">${escapeHtml(label)}</span>`;
      };

      if (resolved) {
        settle(stateText);
        return card;
      }

      actions.innerHTML = `
        <button type="button" data-act="allow" class="px-2.5 py-1 rounded bg-emerald-700 hover:bg-emerald-600 text-white text-[11px] font-semibold">批准执行</button>
        <button type="button" data-act="deny" class="px-2.5 py-1 rounded bg-rose-800 hover:bg-rose-700 text-white text-[11px] font-semibold">拒绝</button>`;

      const decide = async (decision, label) => {
        try {
          const res = await fetch(`/api/approvals/${encodeURIComponent(requestId)}/decide`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ decision, reason: decision === 'deny' ? '用户在界面上拒绝' : '' }),
          });
          const result = await res.json();
          if (!res.ok || result.code !== 0) {
            showErrorBanner('裁决失败: ' + (result.message || res.status));
            return;
          }
          settle(label);
        } catch (err) {
          showErrorBanner('裁决请求异常: ' + err.message);
        }
      };
      actions.querySelector('[data-act="allow"]').addEventListener('click', () => void decide('allow', '已批准'));
      actions.querySelector('[data-act="deny"]').addEventListener('click', () => void decide('deny', '已拒绝'));

      return card;
    }

    /** 渲染任务清单进度卡片（todo_write 的可见产物）。 */
    function renderTodoDock(todos) {
      const dock = document.getElementById('todo-dock');
      const items = document.getElementById('todo-items');
      const progress = document.getElementById('todo-progress');
      if (!dock || !items || !progress) return;

      const list = Array.isArray(todos) ? todos : [];
      if (list.length === 0) {
        dock.classList.add('hidden');
        items.innerHTML = '';
        progress.textContent = '';
        return;
      }
      dock.classList.remove('hidden');
      const done = list.filter((item) => item.status === 'completed').length;
      progress.textContent = `(${done}/${list.length})`;
      items.innerHTML = list.map((item) => {
        const icon = item.status === 'completed' ? '✅' : item.status === 'in_progress' ? '🔵' : '⬜';
        const cls = item.status === 'completed'
          ? 'text-slate-500 line-through'
          : item.status === 'in_progress' ? 'text-blue-300' : 'text-slate-300';
        return `<div class="flex items-start space-x-1.5 text-[11px] ${cls}"><span>${icon}</span><span class="flex-1">${escapeHtml(String(item.content || ''))}</span></div>`;
      }).join('');
    }

    function toggleTodoDock() {
      const items = document.getElementById('todo-items');
      if (items) items.classList.toggle('hidden');
    }

    /** 渲染行级 Diff 审阅卡（红绿对比，可折叠）。 */
    function createDiffCard(meta) {
      const card = document.createElement('div');
      card.className = 'rounded-lg border border-slate-700 bg-[#090d18] overflow-hidden my-1';

      const added = Number(meta.added || 0);
      const removed = Number(meta.removed || 0);
      const head = document.createElement('div');
      head.className = 'flex items-center justify-between px-2.5 py-1.5 bg-[#0f172a] border-b border-slate-800 cursor-pointer select-none';
      head.innerHTML = `
        <span class="text-[11px] font-mono text-slate-300">📝 ${escapeHtml(String(meta.path || ''))}</span>
        <span class="text-[10px] font-mono"><span class="text-emerald-400">+${added}</span> <span class="text-rose-400">-${removed}</span></span>`;

      const body = document.createElement('div');
      body.className = 'max-h-64 overflow-auto text-[11px] font-mono leading-relaxed';
      if (meta.truncated) {
        body.className += ' px-2.5 py-2 text-slate-500';
        body.textContent = '变更过大，已省略逐行对比，请直接查看文件本身。';
      } else {
        const lines = Array.isArray(meta.lines) ? meta.lines : [];
        body.innerHTML = lines.map((line) => {
          const tint = line.type === 'add'
            ? 'bg-emerald-950/40 text-emerald-200'
            : line.type === 'del' ? 'bg-rose-950/40 text-rose-200' : 'text-slate-500';
          const prefix = line.type === 'add' ? '+' : line.type === 'del' ? '-' : ' ';
          return `<div class="${tint} px-2.5 whitespace-pre">${escapeHtml(`${prefix} ${line.text}`)}</div>`;
        }).join('');
      }

      head.addEventListener('click', () => body.classList.toggle('hidden'));
      card.appendChild(head);
      card.appendChild(body);
      return card;
    }

     * 用户消息气泡。

    // 6. 核心发送逻辑 (对齐 deepseek-harness: 0 门槛直发、流式响应、实时 Markdown)
    async function handleSendMessage() {
      hideErrorBanner();
      const textarea = document.getElementById('composer-textarea');
      const text = textarea.value.trim();
      if (!text) {
        if (pendingAttachments.length > 0) {
          showErrorBanner('请补上一句指令，说明希望如何使用附件内容。');
        }
        return;
      }
      const modelId = document.getElementById('topbar-model-select').value || 'deepseek-chat';
      const attachments = pendingAttachments.slice();

      document.getElementById('chat-empty-state').classList.add('hidden');
      const streamBox = document.getElementById('messages-stream-container');
      streamBox.classList.remove('hidden');

      appendUserBubble(text, attachments.map((a) => a.filename));
      // 用户主动发消息：强制滚到底，确保立刻看到自己的输入与新回合
      scrollMessagesToBottom(true);
      textarea.value = '';
      pendingAttachments = [];
      renderAttachmentChips();

      const card = createAssistantCard(null, modelId, true);
      streamBox.appendChild(card.el);
      scrollMessagesToBottom();

      await runStream(text, modelId, card, attachments);
    }

    // 统一的流式调度：负责 SSE 解析、内容渲染与卡片状态更新
    async function runStream(text, modelId, card, attachments) {
      const streamBox = document.getElementById('messages-stream-container');
      const wsPath = activeWorkspacePath || 'G:\\Projects\\Agent\\harness';
      const modelSelect = document.getElementById('topbar-model-select');
      const selectedOption = modelSelect ? modelSelect.selectedOptions[0] : null;
      const providerId = selectedOption?.dataset?.providerId;
      let hasContentStarted = false;
      let accumulatedMd = '';

      const appendToolBadge = (toolName, args) => {
        const badge = document.createElement('div');
        badge.className = 'text-[11px] font-mono text-amber-300/90 bg-amber-950/20 border border-amber-900/30 rounded px-2.5 py-1 my-1';
        badge.textContent = `🔧 执行工具: ${toolName} ${JSON.stringify(args || {})}`;
        card.toolsEl.appendChild(badge);
        scrollMessagesToBottom();
      };

      setRunningState(true);
      activeAbortController = new AbortController();
      // 回合期间由 chat/send 流独占推送，避免与长期订阅重复订阅
      stopSessionWatch();

      try {
        const response = await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: activeSessionId,
            message: text,
            workspacePath: wsPath,
            providerId: providerId,
            modelId: modelId,
            attachments: (attachments || []).map((a) => ({ filename: a.filename, content: a.content })),
            permissionPreset: activePermissionPreset,
          }),
          signal: activeAbortController.signal,
        });

        if (!response.ok) {
          const errJson = await response.json().catch(() => ({}));
          const errMsg = errJson.message || `HTTP ${response.status} 调度失败`;
          card.contentEl.innerHTML = `<span class="text-rose-400 font-mono">❌ ${escapeHtml(errMsg)}</span>`;
          showErrorBanner(errMsg);
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const frames = buffer.split('\n\n');
          buffer = frames.pop() || '';

          for (const frame of frames) {
            if (!frame.trim() || frame.trim().startsWith(':')) continue;
            let eventType = '';
            let dataStr = '';
            for (const line of frame.split('\n')) {
              if (line.startsWith('event:')) eventType = line.slice(6).trim();
              if (line.startsWith('data:')) dataStr = line.slice(5).trim();
            }
            if (!dataStr) continue;
            let data = {};
            try { data = JSON.parse(dataStr); } catch { continue; }

            if (eventType === 'turn-start') {
              lastTurnId = data.turnId;
              card.setTurnId(data.turnId);
              card.setModel(data.model);
              // 本回合启动时间：用于卡片顶部展示
              card.setMeta({ createdAt: Date.now() });
              if (data.sessionId && !activeSessionId) {
                activeSessionId = data.sessionId;
                loadSessionList();
              }
            } else if (eventType === 'reasoning') {
              card.reasoningBox.classList.remove('hidden');
              card.reasoningContent.textContent += (data.text || '');
            } else if (eventType === 'content') {
              if (!hasContentStarted) {
                card.contentEl.innerHTML = '';
                contentStartedReset(card);
                hasContentStarted = true;
              }
              accumulatedMd += (data.text || '');
              card.contentEl.innerHTML = renderMarkdown(accumulatedMd);
              scrollMessagesToBottom();
            } else if (eventType === 'tool-call-start') {
              // ask_user 由专用问答卡片呈现，避免重复渲染工具徽标
              if (data.tool !== 'ask_user') appendToolBadge(data.tool, data.args);
            } else if (eventType === 'question-request') {
              card.toolsEl.appendChild(createQuestionCard(data, null));
              scrollMessagesToBottom();
            } else if (eventType === 'approval-request') {
              card.toolsEl.appendChild(createApprovalCard(data, null));
              scrollMessagesToBottom();
            } else if (eventType === 'tool-result') {
              const line = document.createElement('div');
              line.className = `text-[11px] font-mono rounded px-2.5 py-1 my-0.5 ${data.isError ? 'text-rose-300 bg-rose-950/20 border border-rose-900/30' : 'text-emerald-300/90 bg-emerald-950/20 border border-emerald-900/30'}`;
              line.textContent = `📥 工具输出 (${String(data.output || '').length} 字符)${data.isError ? ' [报错]' : ''}`;
              card.toolsEl.appendChild(line);
              if (data.meta && Array.isArray(data.meta.lines)) {
                card.toolsEl.appendChild(createDiffCard(data.meta));
              }
              scrollMessagesToBottom();
            } else if (eventType === 'todo-update') {
              renderTodoDock(data.todos);
            } else if (eventType === 'turn-end') {
              if (data.turnId) {
                lastTurnId = data.turnId;
                card.setTurnId(data.turnId);
              }
            } else if (eventType === 'done') {
              // 本轮真实消耗回填到卡片（服务端 turn/completed 落盘口径一致）
              card.setMeta({
                inputTokens: Number(data.inputTokens || 0),
                outputTokens: Number(data.outputTokens || 0),
                totalTokens: Number(data.tokens || 0),
              });
              // 顶栏改为「会话累计」而非「最后一轮」，避免历史数据被覆盖丢失
              void refreshSessionUsage();
              loadSessionList();
            } else if (eventType === 'error') {
              showErrorBanner(data.message || '模型通信故障');
            }
          }
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          card.contentEl.innerHTML += '<div class="text-rose-400 text-[11px] font-mono pt-1">⏹ 回合已被用户手动中止 (Aborted)。</div>';
        } else {
          card.contentEl.innerHTML = `<span class="text-rose-400 font-mono">❌ 异常: ${escapeHtml(err.message)}</span>`;
          showErrorBanner(err.message);
        }
      } finally {
        setRunningState(false);
        // 回合结束回到空闲态，恢复长期订阅以承接后台/跨标签的新事件
        if (activeSessionId) startSessionWatch(activeSessionId);
        // 回合已落盘，刷新右侧大纲（以服务端事实为准）
        void refreshTurnOutline();
      }
    }

      card.contentEl.className = 'prose-dark leading-relaxed font-sans';

    // ============ SSE 长期订阅与半开断链重连 (D69 / TC-01-08-002) ============
    const HEARTBEAT_TIMEOUT_MS = 30000;
    let lastKnownSeq = 0;
    const streamWatch = {
      sessionId: null,
      lastSeq: 0,
      lastHeartbeatAt: 0,
      controller: null,
      watchdog: null,
      reconnectTimer: null,
      closed: true,
    };

    function stopSessionWatch() {
      streamWatch.closed = true;
      if (streamWatch.controller) {
        try { streamWatch.controller.abort(); } catch { /* 已关闭 */ }
        streamWatch.controller = null;
      }
      if (streamWatch.watchdog) { clearInterval(streamWatch.watchdog); streamWatch.watchdog = null; }
      if (streamWatch.reconnectTimer) { clearTimeout(streamWatch.reconnectTimer); streamWatch.reconnectTimer = null; }
    }

    /** 空闲态开启长期订阅：接收跨标签/后台产生的新事件，并靠心跳探测半开死链。 */
    function startSessionWatch(sessionId) {
      stopSessionWatch();
      if (!sessionId) return;
      streamWatch.sessionId = sessionId;
      streamWatch.closed = false;
      streamWatch.lastSeq = lastKnownSeq;
      streamWatch.lastHeartbeatAt = Date.now();
      void openSessionStream();

      streamWatch.watchdog = setInterval(() => {
        if (streamWatch.closed) return;
        if (Date.now() - streamWatch.lastHeartbeatAt > HEARTBEAT_TIMEOUT_MS) {
          console.warn('[PGH] 超过 30s 未收到心跳，判定半开断链，正在重连并拉齐…');
          void reconnectSessionStream();
        }
      }, 5000);
    }

    async function reconnectSessionStream() {
      if (streamWatch.closed || !streamWatch.sessionId) return;
      if (streamWatch.controller) {
        try { streamWatch.controller.abort(); } catch { /* 已关闭 */ }
        streamWatch.controller = null;
      }
      // 携带持有的最新 seq 重新拉齐，断网期间的事件帧会被全量补发
      await switchSession(streamWatch.sessionId);
      await openSessionStream();
    }

    function scheduleStreamReconnect() {
      if (streamWatch.closed || streamWatch.reconnectTimer) return;
      streamWatch.reconnectTimer = setTimeout(() => {
        streamWatch.reconnectTimer = null;
        void reconnectSessionStream();
      }, 2000);
    }

    async function openSessionStream() {
      if (streamWatch.closed || !streamWatch.sessionId) return;
      const controller = new AbortController();
      streamWatch.controller = controller;
      streamWatch.lastHeartbeatAt = Date.now();
      try {
        const res = await fetch(`/api/sessions/${streamWatch.sessionId}/stream?after=${streamWatch.lastSeq}`, {
          signal: controller.signal,
        });
        if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const frames = buffer.split('\n\n');
          buffer = frames.pop() || '';

          for (const frame of frames) {
            const trimmed = frame.trim();
            if (trimmed === '') continue;
            // 注释帧即心跳：刷新看门狗
            if (trimmed.startsWith(':')) {
              streamWatch.lastHeartbeatAt = Date.now();
              continue;
            }
            let eventType = '';
            let dataStr = '';
            for (const line of frame.split('\n')) {
              if (line.startsWith('event:')) eventType = line.slice(6).trim();
              if (line.startsWith('data:')) dataStr = line.slice(5).trim();
            }
            if (!dataStr) continue;
            let data = {};
            try { data = JSON.parse(dataStr); } catch { continue; }
            if (typeof data.seq === 'number') {
              streamWatch.lastSeq = Math.max(streamWatch.lastSeq, data.seq);
              lastKnownSeq = Math.max(lastKnownSeq, data.seq);
            }
            if (eventType === 'stream-ready') streamWatch.lastHeartbeatAt = Date.now();
          }
        }
        if (!streamWatch.closed) scheduleStreamReconnect();
      } catch (err) {
        if (err.name === 'AbortError') return;
        if (!streamWatch.closed) scheduleStreamReconnect();
      }
    }

    // 息屏/休眠后切回前台：立即重连并拉齐（不等 30s 看门狗），并保证滚动贴合最新消息
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (streamWatch.closed || !streamWatch.sessionId) return;
      console.info('[PGH] 切回前台，主动校验 SSE 连接…');
      void reconnectSessionStream();
      // 切回前台时，默认定位到最新的一条对话
      scrollMessagesToBottom(true);
    });

    // 加载当前工作区已启用的 Skills，供输入框快捷下拉选择
    async function loadSkillsToComposer() {
      const select = document.getElementById('composer-skill-select');
      if (!select) return;
      try {
        const wsParam = encodeURIComponent(activeWorkspacePath || '');
        const res = await fetch(`/api/skills?workspace=${wsParam}`);
        const json = await res.json();
        if (json.code === 0 && Array.isArray(json.data)) {
          select.innerHTML = '<option value="">🧩 快捷使用 Skill...</option>';
          const enabledSkills = json.data.filter((s) => s.enabled !== false);
          if (enabledSkills.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '(暂无已启用的 Skill)';
            opt.disabled = true;
            select.appendChild(opt);
            return;
          }
          enabledSkills.forEach((s) => {
            const opt = document.createElement('option');
            opt.value = s.name;
            opt.textContent = `${s.name} (${s.scope === 'project' ? '项目' : '全局'})`;
            opt.title = s.description || '';
            select.appendChild(opt);
          });
        }
      } catch (err) {
        console.warn('Load skills to composer failed:', err);
      }
    }

    function handleSelectSkillToComposer(skillName) {
      if (!skillName) return;
      const textarea = document.getElementById('composer-textarea');
      if (!textarea) return;
      const current = textarea.value.trim();
      // 如果当前没有 /skill 开头，则插入 /skill <name> 
      if (!current.startsWith('/skill ')) {
        textarea.value = `/skill ${skillName} ${current}`.trimStart();
      } else {
        // 替换已有的 /skill 前缀
        textarea.value = current.replace(/^\/skill\s+\S+/, `/skill ${skillName}`);
      }
      textarea.focus();
      // 重置下拉框
      document.getElementById('composer-skill-select').value = '';
    }

    // 页面就绪入口
    window.addEventListener('DOMContentLoaded', async () => {
      renderPermissionPreset();
      renderTurnOutline();
      await loadWorkspaces();
      await loadModels();
      await loadSessionList();
      await loadSkillsToComposer();
      setupKeyboardListener();
      await checkBootstrap();
    });
  </script>
</body>
</html>
