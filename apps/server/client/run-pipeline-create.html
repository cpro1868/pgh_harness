<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="ico/pgh.svg">
  <title>新建流水线任务 - 步骤与角色自定义 - Purple Grapes Harness (PGH)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/shared.css">
  <script src="js/theme.js"></script>
</head>
<body class="bg-[#070a12] text-slate-100 min-h-screen flex font-sans">

  <!-- 1. 全系统严格一致的 48px 一级侧边栏 -->
  <aside class="activity-bar h-full">
    <a href="run-chat.html" class="activity-btn" title="对话工作台 (Chat)">

    </a>
    <a href="run-pipeline.html" class="activity-btn active" title="角色流水线 (Pipeline)">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
    </a>
    <a href="config-workspace.html" class="activity-btn" title="工作区管理与规则">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
    </a>
    <a href="config-memories.html" class="activity-btn" title="记忆管理中心">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
    </a>
    <a href="config-providers.html" class="activity-btn" title="模型与Provider资产">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
    </a>
    <a href="config-pipelines.html" class="activity-btn" title="流水线模板设定">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
    </a>
    <a href="config-mcp.html" class="activity-btn" title="MCP 外部服务">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
    </a>
    <a href="config-skills.html" class="activity-btn" title="Skills 技能库">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    </a>
    <div class="flex-1"></div>
    <a href="config-settings.html" class="activity-btn" title="系统全局设置 (Settings)">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </a>
  </aside>

  <!-- 2. 主内容区 (完整表单大屏) -->
  <div class="flex-1 flex flex-col overflow-y-auto">
    
    <!-- 顶栏 -->
    <header class="h-10 bg-[#090d18] border-b border-[#1a2333] px-6 flex items-center justify-between sticky top-0 z-40 text-xs">
      <div class="flex items-center space-x-3">
        <a href="run-pipeline.html" class="text-slate-400 hover:text-white flex items-center pr-2 border-r border-slate-800">
          <span>&larr; 返回任务列表</span>
        </a>
        <h1 class="text-xs font-bold text-white">发起新多角色流水线任务 · 步骤与规格定制</h1>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="addCustomStep()" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center space-x-1 font-mono">
          <span>＋</span><span>增加流水线步骤</span>
        </button>
        <button onclick="saveDraftSpecification()" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-purple-950 text-purple-300 border border-purple-800/60 font-medium shadow-sm">
          💾 保存规格草稿 (不启动)
        </button>
        <button onclick="saveAndStartPipeline()" class="px-4 py-1.5 rounded bg-purple-600 hover:bg-purple-500 text-white font-semibold shadow-md flex items-center space-x-1.5">
          <span>🚀 确认指令并立即启动 &rarr;</span>
        </button>
      </div>
    </header>

    <main class="flex-1 p-8 space-y-8 max-w-5xl w-full mx-auto text-xs">
      
      <!-- 1. 任务基础信息 (目标与工作区) -->
      <section class="p-6 rounded-xl bg-[#0c1220] border border-slate-800 space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-blue-400"></span>
            <h2 class="text-sm font-bold text-white">任务基础信息</h2>
          </div>
          <span class="text-[10px] text-slate-500 font-mono">任务级元数据 · 非流水线步骤</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="block text-slate-300 font-medium">任务名称 / 目标需求 (Task Name)：</label>
            <input id="input-task-name" type="text" placeholder="例如：针对 Issue #101 实现支付网关签名防重放机制" class="w-full bg-[#090d18] border border-slate-700 rounded px-3 py-2 text-white font-medium focus:border-purple-500">
          </div>

          <div class="space-y-1.5">
            <label class="block text-slate-300 font-medium">绑定目标工作区目录 (Workspace Root)：</label>
            <select id="select-workspace" class="w-full bg-[#090d18] border border-slate-700 rounded px-3 py-2 text-blue-300 font-mono focus:border-purple-500"></select>
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-slate-300 font-medium">初始用户指令 / 详细需求约束 (Instruction · 必填)：</label>
          <textarea id="input-instruction" rows="3" placeholder="例如：外部请求在 timestamp 超过 300 秒或 Nonce 重复时拒绝；使用内存 LRU 结构存储近 10 万条 Nonce；补齐单元测试。" class="w-full bg-[#090d18] border border-slate-700 rounded p-2.5 text-white placeholder-slate-500 focus:border-purple-500 leading-relaxed font-mono text-[11px]"></textarea>
          <span class="text-[10px] text-slate-500">系统严格要求必须提供明确的用户指令，Agent 角色才会开始介入跑取任务。</span>
        </div>
      </section>

      <!-- 2. 流水线步骤与角色执行编排设置 -->
      <section class="p-6 rounded-xl bg-[#0c1220] border border-slate-800 space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <div>
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-purple-400"></span>
              <h2 class="text-sm font-bold text-white">流水线步骤 (Steps) 与负责角色 (Roles) 编排</h2>
            </div>
            <p class="text-xs text-slate-400 mt-0.5">可根据任务自由增删步骤、调换顺序、指定每个步骤由哪个 Agent 角色负责、绑定模型、设定指令契约与工具权限。</p>
          </div>

          <button onclick="addCustomStep()" class="px-3 py-1.5 rounded bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold shadow flex items-center space-x-1.5 transition">
            <span>＋ 在末尾追加步骤</span>
          </button>
        </div>

        <!-- 步骤列表容器 -->
        <div id="steps-container" class="space-y-4 font-mono text-xs">
          <!-- 动态加载或编辑步骤卡片 -->
        </div>
      </section>

      <!-- 底部操作栏 -->
      <div class="flex items-center justify-between pt-4 border-t border-slate-800 text-xs">
        <a href="run-pipeline.html" class="px-4 py-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-300">取消并返回列表</a>
        
        <div class="flex items-center space-x-3">
          <button onclick="saveDraftSpecification()" class="px-4 py-2 rounded bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/40">
            💾 仅保存任务规格 (暂不跑取)
          </button>
          <button onclick="saveAndStartPipeline()" class="px-6 py-2 rounded bg-purple-600 hover:bg-purple-500 text-white font-semibold shadow-lg flex items-center space-x-1.5">
            <span>🚀 确认规格并立即启动 &rarr;</span>
          </button>
        </div>
      </div>

    </main>
  </div>

  <script>
    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text === undefined || text === null ? '' : text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    let currentPipelineId = 'pipeline_std_rd';
    let availableModels = [];

    async function loadModels() {
      try {
        const res = await fetch('/api/providers');
        const json = await res.json();
        const list = json.data || [];
        availableModels = [];
        list.forEach((p) => (p.models || []).forEach((m) => availableModels.push({ id: m.id, provider: p.name })));
      } catch (err) {
        console.warn('Load models failed:', err);
      }
    }

    // 渲染步骤模型下拉选项（真实读取系统已配置模型，不硬编码）
    function buildModelOptions(selectedId) {
      const ids = new Set(availableModels.map((m) => m.id));
      const parts = [];
      if (!availableModels.length) {
        if (selectedId) parts.push(`<option value="${escapeHtml(selectedId)}" selected>${escapeHtml(selectedId)}（未在当前 Provider 配置中）</option>`);
        parts.push('<option value="">（系统尚未配置模型）</option>');
        return parts.join('');
      }
      if (selectedId && !ids.has(selectedId)) {
        parts.push(`<option value="${escapeHtml(selectedId)}" selected>${escapeHtml(selectedId)}（未在当前 Provider 配置中）</option>`);
      }
      parts.push(`<option value="" ${selectedId ? '' : 'selected'}>（跟随全局默认模型）</option>`);
      availableModels.forEach((m) => {
        parts.push(`<option value="${escapeHtml(m.id)}" ${m.id === selectedId ? 'selected' : ''}>${escapeHtml(m.id)}（${escapeHtml(m.provider)}）</option>`);
      });
      return parts.join('');
    }

    async function init() {
      // 1. 加载工作区列表
      try {
        const wsRes = await fetch('/api/workspaces');
        const wsJson = await wsRes.json();
        const wsList = wsJson.data || [];
        const wsSelect = document.getElementById('select-workspace');
        wsSelect.innerHTML = wsList.map((w) => `<option value="${escapeHtml(w.path)}">${escapeHtml(w.name || w.path)} (${escapeHtml(w.path)})</option>`).join('');
      } catch (err) {
        console.warn('Load workspaces failed:', err);
      }

      // 2. 加载系统真实已配置模型
      await loadModels();

      // 3. 加载选中的模板以初始填充步骤卡片
      const urlParams = new URLSearchParams(window.location.search);
      currentPipelineId = urlParams.get('templateId') || 'pipeline_std_rd';

      try {
        const pipeRes = await fetch('/api/pipelines');
        const pipeJson = await pipeRes.json();
        const list = pipeJson.data || [];
        const pipe = list.find((p) => p.id === currentPipelineId) || list[0];
        if (pipe && Array.isArray(pipe.stages)) {
          const container = document.getElementById('steps-container');
          container.innerHTML = '';
          pipe.stages.forEach((s, idx) => {
            container.appendChild(buildStepElement(idx + 1, s));
          });
        }
      } catch (err) {
        console.warn('Load pipeline failed:', err);
      }
    }

    function buildStepElement(index, data = {}) {
      const stepDiv = document.createElement('div');
      stepDiv.className = 'step-card p-4 rounded-lg bg-[#090d18] border border-slate-800 space-y-3 relative group hover:border-purple-500/40 transition';
      const stageName = data.name || `步骤${index}`;
      const role = data.roleName || `自定义角色 ${index}`;
      const prompt = data.promptTemplate || '';
      const gate = data.gatekeeperRequired !== false;
      const artifact = (data.artifactPaths || []).join(', ');

      stepDiv.innerHTML = `
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2 flex-1 min-w-0">
            <span class="step-num w-6 h-6 rounded-full bg-purple-950 text-purple-300 border border-purple-800 flex items-center justify-center font-mono font-bold text-xs shrink-0">${index}</span>
            <input type="text" value="${escapeHtml(stageName)}" class="step-name flex-1 min-w-0 bg-transparent border-b border-transparent hover:border-slate-700 focus:border-purple-500 text-xs font-bold text-white px-1 py-0.5 focus:outline-none" placeholder="步骤语义名称（可编辑）" oninput="onStepNameInput(this)">
          </div>
          <div class="flex items-center space-x-2 text-[11px] font-sans shrink-0">
            <button onclick="insertStepAfter(this)" class="text-purple-400 hover:text-purple-300 font-medium">+ 在此步骤后插入</button>
            <span class="text-slate-700">|</span>
            <span class="step-order text-slate-500 font-mono">顺序: ${String(index).padStart(2, '0')}</span>
            <span class="text-slate-700">|</span>
            <button onclick="removeStep(this)" class="text-rose-400 hover:text-rose-300">删除步骤</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-sans">负责 Agent 角色名称：</label>
            <input type="text" value="${escapeHtml(role)}" class="step-role w-full bg-[#0c1220] border border-slate-700 rounded px-2.5 py-1.5 text-white font-medium">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-sans">绑定推荐模型：</label>
            <select class="step-model w-full bg-[#0c1220] border border-slate-700 rounded px-2.5 py-1.5 text-white">
              ${buildModelOptions(data.modelId || '')}
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-sans">步骤流转审批门 (Gatekeeper)：</label>
            <select class="step-gate w-full bg-[#0c1220] border border-slate-700 rounded px-2.5 py-1.5 text-amber-300 font-medium">
              <option value="true" ${gate ? 'selected' : ''}>需人工确认产物后推进 (Gatekeeper)</option>
              <option value="false" ${!gate ? 'selected' : ''}>自动放行流入下一步</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-sans">该步骤 Agent 提示词说明 (具体做什么)：</label>
            <textarea rows="2" class="step-prompt w-full bg-[#0c1220] border border-slate-700 rounded p-2 text-slate-300 font-mono text-[11px] focus:outline-none">${escapeHtml(prompt)}</textarea>
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-sans">产出交付工件至 (选填目录，留空按 Git 追踪)：</label>
            <input type="text" value="${escapeHtml(artifact)}" placeholder="例如 artifacts/ 或留空按 Git 追踪" class="step-artifact w-full bg-[#0c1220] border border-slate-700 rounded px-2.5 py-1.5 text-blue-300 font-mono text-[11px]">
            <div class="text-[10px] text-slate-500 mt-1 font-sans">审定放行后在所有下游阶段强制只读守护</div>
          </div>
        </div>
      `;
      return stepDiv;
    }

    function onStepNameInput(input) {
      const card = input.closest('.step-card');
      const num = card.querySelector('.step-num').textContent;
      const orderEl = card.querySelector('.step-order');
      if (orderEl) orderEl.textContent = '顺序: ' + String(num).padStart(2, '0');
    }

    function addCustomStep() {
      const container = document.getElementById('steps-container');
      const count = container.querySelectorAll('.step-card').length + 1;
      container.appendChild(buildStepElement(count, {
        name: `步骤${count}`,
        roleName: `新增角色 ${count}`,
        promptTemplate: '执行指定任务目标并提交交付工件',
        modelId: availableModels[0]?.id || '',
      }));
      reindexSteps();
    }

    function insertStepAfter(btn) {
      const card = btn.closest('.step-card');
      const newCard = buildStepElement(1, {
        name: '新插入步骤',
        roleName: '新插入步骤',
        promptTemplate: '执行指定步骤任务并产出工件',
        modelId: availableModels[0]?.id || '',
      });
      card.parentNode.insertBefore(newCard, card.nextSibling);
      reindexSteps();
    }

    function removeStep(btn) {
      const cards = document.querySelectorAll('#steps-container .step-card');
      if (cards.length <= 1) {
        alert('流水线至少需要保留一个阶段');
        return;
      }
      btn.closest('.step-card').remove();
      reindexSteps();
    }

    function reindexSteps() {
      const cards = document.querySelectorAll('#steps-container .step-card');
      cards.forEach((card, idx) => {
        const num = idx + 1;
        const numEl = card.querySelector('.step-num');
        const nameEl = card.querySelector('.step-name');
        const orderEl = card.querySelector('.step-order');
        if (numEl) numEl.textContent = num;
        if (nameEl && !nameEl.value.trim()) nameEl.value = `步骤${num}`;
        if (orderEl) orderEl.textContent = '顺序: ' + String(num).padStart(2, '0');
      });
    }

    function collectFormStages() {
      const cards = document.querySelectorAll('#steps-container .step-card');
      return Array.from(cards).map((card, idx) => {
        const name = card.querySelector('.step-name').value.trim() || `步骤${idx + 1}`;
        const roleName = card.querySelector('.step-role').value.trim() || `角色 ${idx + 1}`;
        const promptTemplate = card.querySelector('.step-prompt').value.trim() || '';
        const modelId = card.querySelector('.step-model').value;
        const gatekeeperRequired = card.querySelector('.step-gate').value === 'true';
        const artifactRaw = card.querySelector('.step-artifact').value.trim();
        const artifactPaths = artifactRaw ? artifactRaw.split(/[,，\n]/).map((s) => s.trim()).filter(Boolean) : [];

        return {
          id: `stg_custom_${Date.now()}_${idx}`,
          order: idx + 1,
          name,
          roleName,
          promptTemplate,
          modelId,
          toolsAllowed: ['read_file', 'edit_file', 'write_file', 'glob', 'grep', 'bash'],
          artifactPaths,
          gatekeeperRequired,
        };
      });
    }

    // 第一点要求：支持先设计规格，保存草稿，暂不跑取
    async function saveDraftSpecification() {
      const taskName = document.getElementById('input-task-name').value.trim();
      const workspacePath = document.getElementById('select-workspace').value;
      const instruction = document.getElementById('input-instruction').value.trim();
      const stages = collectFormStages();

      if (!workspacePath) { alert('请先选择工作区'); return; }

      try {
        const res = await fetch('/api/pipeline-instances/draft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: taskName,
            pipelineId: currentPipelineId,
            workspacePath,
            taskPrompt: instruction,
            stages,
          }),
        });
        const json = await res.json();
        if (json.code === 0) {
          alert('✓ 任务规格草稿已成功保存！可在任务列表中查看或随时进入工作台启动。');
          window.location.href = `run-pipeline-detail.html?id=${encodeURIComponent(json.data.instanceId)}`;
        } else {
          alert('保存失败: ' + json.message);
        }
      } catch (err) {
        alert('保存异常: ' + err.message);
      }
    }

    // 第三点要求：必须接入明确用户指令才能启动跑取
    async function saveAndStartPipeline() {
      const taskName = document.getElementById('input-task-name').value.trim();
      const workspacePath = document.getElementById('select-workspace').value;
      const instruction = document.getElementById('input-instruction').value.trim();
      const stages = collectFormStages();

      if (!workspacePath) { alert('请先选择工作区'); return; }
      if (!instruction) {
        alert('错误：启动流水线前必须输入明确的初始用户指令（Instruction）！');
        document.getElementById('input-instruction').focus();
        return;
      }

      try {
        const res = await fetch('/api/pipeline-instances/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: taskName,
            pipelineId: currentPipelineId,
            workspacePath,
            taskPrompt: instruction,
            instruction,
            stages,
          }),
        });
        const json = await res.json();
        if (json.code === 0) {
          window.location.href = `run-pipeline-detail.html?id=${encodeURIComponent(json.data.instanceId)}`;
        } else {
          alert('启动失败: ' + json.message);
        }
      } catch (err) {
        alert('启动异常: ' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
