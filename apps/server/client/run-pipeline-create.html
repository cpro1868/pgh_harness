<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="ico/pgh.svg">
  <title>配置并启动流水线任务 - Purple Grapes Harness (PGH)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/shared.css">
</head>
<body class="bg-[#070a12] text-slate-100 font-sans">

  <!-- 统一 40px 顶栏 -->
  <header class="h-10 border-b border-[#1a2333] flex items-center justify-between px-4 bg-[#0a0f1d] shrink-0 text-xs">
    <div class="flex items-center space-x-2.5">
      <img src="ico/pgh.svg" alt="Purple Grapes Harness" class="w-6 h-6 rounded shadow-sm">
      <span class="font-bold text-white tracking-wide text-xs">Purple Grapes Harness</span>
      <span class="text-slate-600">/</span>
      <span class="text-slate-400 font-medium">配置步骤/角色并启动新流水线任务</span>
    </div>
    <div class="flex items-center space-x-2">
      <a href="run-pipeline.html" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs">返回任务大屏</a>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden" style="height: calc(100vh - 40px);">

    <!-- 全系统严格一致的 48px 一级侧边栏 -->
    <aside class="activity-bar">
      <a href="run-chat.html" class="activity-btn" title="对话工作台 (Chat)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      </a>
      <a href="run-pipeline.html" class="activity-btn active" title="角色流水线 (Pipeline)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
      </a>
      <a href="config-workspace.html" class="activity-btn" title="工作区管理与规则">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
      </a>
      <a href="config-memories.html" class="activity-btn" title="记忆管理中心">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
      </a>
      <a href="config-providers.html" class="activity-btn" title="模型与Provider资产">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      </a>
      <a href="config-pipelines.html" class="activity-btn" title="流水线模板设定">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
      </a>
      <a href="config-mcp.html" class="activity-btn" title="MCP 外部服务">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
      </a>
      <a href="config-skills.html" class="activity-btn" title="Skills 技能库">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </a>
      <div class="flex-1"></div>
      <a href="config-settings.html" class="activity-btn" title="系统全局设置 (Settings)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </a>
    </aside>

    <!-- 主面板 -->
    <main class="flex-1 p-8 max-w-4xl w-full mx-auto space-y-6 overflow-y-auto">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">定制并启动多角色流水线任务</h1>
        <p class="text-xs text-slate-400 mt-1">选择底座模板与目标物理工作区，设定核心研发需求指令，按需调整阶段顺序与审批门。</p>
      </div>

      <div class="p-6 rounded-xl bg-[#0c1220] border border-slate-800 space-y-5 shadow-lg text-xs font-sans">
        <div>
          <label class="block text-slate-300 font-medium mb-1">选择流水线模板：</label>
          <select id="select-pipeline" onchange="onPipelineChange(this.value)" class="w-full bg-[#090d18] border border-slate-700 rounded px-3 py-2 text-white font-mono focus:outline-none focus:border-blue-500"></select>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">绑定本地物理工作区 (生命周期锁定)：</label>
          <select id="select-workspace" class="w-full bg-[#090d18] border border-slate-700 rounded px-3 py-2 text-blue-300 font-mono focus:outline-none focus:border-blue-500"></select>
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">流水线启动总任务指令 (Task Prompt)：</label>
          <textarea id="task-prompt" rows="3" placeholder="例如: 为本仓库重构用户认证鉴权模块，新增 JWT 双令牌无感刷新，并使用 TDD 方式编写自动化测试" class="w-full bg-[#090d18] border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-blue-500 leading-relaxed"></textarea>
        </div>

        <!-- 阶段泳道预览 -->
        <div class="space-y-2 pt-2 border-t border-slate-800">
          <div class="flex items-center justify-between">
            <span class="text-slate-400 font-semibold">泳道阶段预览与执行顺序</span>
            <span class="text-[11px] text-purple-400 font-mono">顺序执行 · 阶段工件严密隔离</span>
          </div>
          <div id="stages-preview" class="space-y-2 font-mono"></div>
        </div>

        <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
          <span id="start-status" class="text-emerald-400 font-mono"></span>
          <button onclick="startPipelineInstance()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-semibold shadow-md flex items-center space-x-1.5">
            <span>🚀</span><span>立即启动流水线任务</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text === undefined || text === null ? '' : text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    let allPipelines = [];

    async function init() {
      // 1. 加载模板列表
      const pipeRes = await fetch('/api/pipelines');
      const pipeJson = await pipeRes.json();
      allPipelines = pipeJson.data || [];
      const pipeSelect = document.getElementById('select-pipeline');
      pipeSelect.innerHTML = allPipelines.map((p) => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} (${p.stages.length} 阶段)</option>`).join('');

      // 2. 加载工作区列表
      const wsRes = await fetch('/api/workspaces');
      const wsJson = await wsRes.json();
      const wsList = wsJson.data || [];
      const wsSelect = document.getElementById('select-workspace');
      wsSelect.innerHTML = wsList.map((w) => `<option value="${escapeHtml(w.path)}">${escapeHtml(w.name || w.path)} (${escapeHtml(w.path)})</option>`).join('');

      // 若 URL 带 templateId 则选中
      const urlParams = new URLSearchParams(window.location.search);
      const tid = urlParams.get('templateId');
      if (tid && allPipelines.some((p) => p.id === tid)) {
        pipeSelect.value = tid;
      }

      onPipelineChange(pipeSelect.value);
    }

    function onPipelineChange(pid) {
      const target = allPipelines.find((p) => p.id === pid);
      const preview = document.getElementById('stages-preview');
      if (!target) { preview.innerHTML = ''; return; }

      preview.innerHTML = target.stages.map((s, idx) => `
        <div class="p-3 rounded-lg bg-[#090d18] border border-slate-800 flex items-center justify-between text-xs">
          <div class="flex items-center space-x-3">
            <span class="w-6 h-6 rounded-full bg-purple-950 text-purple-300 border border-purple-800 flex items-center justify-center font-bold text-[11px]">${idx + 1}</span>
            <div>
              <div class="font-bold text-white">${escapeHtml(s.roleName)}</div>
              <div class="text-[10px] text-slate-400 font-sans line-clamp-1">${escapeHtml(s.promptTemplate)}</div>
            </div>
          </div>
          <div class="flex items-center space-x-2 text-[10px]">
            <span class="px-2 py-0.5 rounded ${s.gatekeeperRequired ? 'bg-amber-950 text-amber-300 border border-amber-800/40' : 'bg-slate-800 text-slate-400'}">
              ${s.gatekeeperRequired ? '需 Gatekeeper 卡点' : '自动放行'}
            </span>
          </div>
        </div>
      `).join('');
    }

    async function startPipelineInstance() {
      const pipelineId = document.getElementById('select-pipeline').value;
      const workspacePath = document.getElementById('select-workspace').value;
      const taskPrompt = document.getElementById('task-prompt').value.trim();
      const statusEl = document.getElementById('start-status');

      if (!workspacePath) { alert('请先选择工作区'); return; }
      if (!taskPrompt) { alert('请输入总任务指令'); return; }

      statusEl.textContent = '正在启动泳道实例...';
      try {
        const res = await fetch('/api/pipeline-instances/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pipelineId, workspacePath, taskPrompt }),
        });
        const json = await res.json();
        if (json.code === 0) {
          statusEl.textContent = '✓ 实例启动成功！正在跳转至大屏...';
          setTimeout(() => {
            window.location.href = 'run-pipeline.html';
          }, 800);
        } else {
          statusEl.textContent = '启动失败: ' + json.message;
        }
      } catch (err) {
        statusEl.textContent = '异常: ' + err.message;
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
