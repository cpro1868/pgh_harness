  </style>
</head>
<body class="bg-[#070a12] text-slate-100 h-screen flex overflow-hidden font-sans">

  <!-- 2. 主体工作台 (全屏 IDE 布局) -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- 顶栏：紧凑 38px，包含工作区绑定与返回列表 -->
    <header class="ide-top-bar">
      <div class="flex items-center space-x-2">
        <a href="run-pipeline.html" class="text-slate-400 hover:text-white flex items-center pr-2 border-r border-slate-800">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
          <span>返回任务列表</span>
        </a>

        <!-- 显眼绑定的工作区 (绝对路径锁定 🔒) -->
        <div class="flex items-center space-x-1.5 px-2 py-0.5 rounded bg-slate-800/70 border border-slate-700/60 font-mono text-[11px]">
          <span class="text-blue-400">🔒 工作区:</span>
          <span id="top-workspace" class="text-slate-200 font-semibold">--</span>
          <span id="top-branch" class="text-slate-500 text-[10px]"></span>
        </div>

        <span class="text-slate-600">/</span>
        <span id="top-instance-id" class="font-mono text-purple-300 font-bold">--</span>
        <span id="top-instance-name" class="text-slate-400 text-xs truncate max-w-xs">--</span>
      </div>

      <div class="flex items-center space-x-3">
        <div class="flex items-center space-x-1.5 text-slate-400 font-mono text-[11px]">
          <span>当前角色:</span>
          <span id="top-current-role" class="text-amber-300 font-bold bg-amber-950/60 px-1.5 py-0.5 rounded border border-amber-800/40">--</span>
        </div>
        <button id="btn-pause" type="button" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] border border-slate-700 font-medium">暂停</button>
        <button type="button" onclick="abortTask()" class="px-2.5 py-1 rounded bg-rose-600 hover:bg-rose-500 text-white text-[10px] font-medium">终止任务</button>
        <button type="button" onclick="deleteTask()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-300 text-[10px] border border-slate-700 font-medium">删除</button>
      </div>
    </header>

    <!-- 四阶段水平状态条 (紧凑顶置) -->
    <div class="px-4 py-2.5 bg-[#090e1c] border-b border-[#1a2333] flex items-center justify-between">
      <div id="stage-flow" class="flex items-center space-x-3 w-full max-w-5xl">
        <div class="text-slate-500 text-xs font-mono">正在读取泳道状态...</div>
      </div>
      <span id="top-elapsed" class="text-[11px] text-slate-400 font-mono pl-4 flex-shrink-0">流水线已运行: 0分0秒</span>
    </div>

    <!-- 主体：左侧为针对当前流水线的人机交互对话流 + 下达指令框；右侧为当前工件与人工审批 -->
    <div class="flex-1 flex overflow-hidden">

      <!-- 左侧主栏：人机交互指令对话流 (Chat Console for Pipeline) -->
      <div class="flex-1 flex flex-col bg-[#070a12] border-r border-[#1a2333] overflow-hidden">

        <!-- 对话流消息区域 -->
        <div id="chat-stream" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto font-sans">
          <div class="p-2.5 rounded bg-[#090e1a] border border-slate-800/80 text-xs text-slate-400 font-mono">正在加载流水线活动流...</div>
        </div>

        <!-- 底部针对当前阶段 Agent 的指令输入框 (Composer) -->
        <div class="p-3 border-t border-[#1a2333] bg-[#090d18]">
          <div class="max-w-3xl mx-auto space-y-1.5">
            <div class="flex items-center justify-between text-[11px] text-slate-400">
              <span>向当前负责 Agent (<span id="composer-role" class="text-amber-300 font-mono">--</span>) 下达指令或反馈：</span>
              <span class="text-[10px] text-slate-500 font-mono">Enter 发送 · Shift+Enter 换行</span>
            </div>
            <div class="border border-slate-700/80 rounded-lg bg-[#0b101c] p-2 focus-within:border-purple-500 transition">
              <textarea id="composer-input" placeholder="例如：测试用例还需要覆盖负数时间戳的情况，请补充修复..." class="w-full bg-transparent border-0 resize-none text-xs text-white placeholder-slate-500 focus:outline-none min-h-[38px] max-h-24"></textarea>
              <div class="flex items-center justify-between pt-1 border-t border-slate-800/80 text-[11px]">
                <div class="flex items-center space-x-2 text-slate-500 text-[10px]">
                  <span>工作区锁定: <span id="composer-workspace" class="font-mono">--</span></span>
                </div>
                <div class="flex items-center space-x-1.5">
                  <button id="btn-transfer" type="button" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] border border-slate-700">转交下一阶段</button>
                  <button type="button" onclick="sendInstruction()" class="px-3 py-1 rounded bg-purple-600 hover:bg-purple-500 text-white font-medium text-[10px]">发送指令</button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- 右侧侧边栏：阶段工件库与人工审批门 (Gatekeeper) -->
      <div class="w-80 bg-[#090d18] border-l border-[#1a2333] p-4 space-y-5 overflow-y-auto flex-shrink-0">

        <!-- 人工审批 Gatekeeper 卡片 -->
        <div id="gatekeeper-card" class="hidden p-3.5 rounded-xl bg-amber-950/30 border border-amber-500/50 space-y-2.5 shadow-lg">
          <div class="flex items-center space-x-2">
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <h3 id="gatekeeper-title" class="text-xs font-bold text-amber-300">阶段进入审批卡点</h3>
          </div>
          <p id="gatekeeper-note" class="text-[11px] text-slate-300 leading-relaxed">
            本阶段工件产出后，必须经人工确认后方可唤醒下一阶段 Agent。
          </p>
          <div class="pt-1.5 flex items-center justify-between text-xs">
            <button type="button" onclick="openDiffModal()" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] border border-slate-700">查看改动 Diff</button>
            <div class="flex items-center space-x-1.5">
              <button type="button" onclick="resolveGateAction('reject')" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-rose-950 text-slate-300 hover:text-rose-300 text-[10px] border border-slate-700">打回重做</button>
              <button type="button" onclick="resolveGateAction('approve')" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-[10px] shadow">批准并放行</button>
            </div>
          </div>
        </div>

        <!-- 累计产出的流水线工件 (Artifacts) -->
        <div class="space-y-3">
          <h3 class="text-xs font-bold text-white flex items-center justify-between">
            <span>流水线交付工件 (Artifacts)</span>
            <span id="artifact-count" class="text-[10px] text-slate-500 font-mono">0 Files</span>
          </h3>
          <div id="artifact-list" class="space-y-2">
            <div class="text-[11px] text-slate-500 font-mono py-1">暂无交付工件</div>
          </div>
        </div>

        <!-- 任务上下文与元数据 -->
        <div class="p-3 rounded-lg bg-[#0b101c] border border-slate-800/80 space-y-2 text-xs font-mono">
          <div class="text-slate-400 font-bold text-[11px]">任务元数据</div>
          <div class="text-slate-400 text-[10px] space-y-1">
            <div>模板: <span id="meta-pipeline" class="text-slate-300">--</span></div>
            <div>启动时间: <span id="meta-started" class="text-slate-300">--</span></div>
            <div>消耗 Tokens: <span id="meta-tokens" class="text-slate-300">0</span></div>
            <div>当前活跃分支: <span id="meta-branch" class="text-slate-300">--</span></div>
          </div>
          <div class="pt-2 border-t border-slate-800/60 text-[10px] text-slate-400 font-sans leading-relaxed">
            <span class="text-slate-500">任务目标：</span><span id="meta-task" class="text-slate-300">--</span>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- 改动 Diff 审阅弹窗 (只读 Git Diff) -->
  <div id="diff-modal" class="hidden fixed inset-0 z-[60] bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-3xl h-[70vh] rounded-xl bg-[#0f172a] border border-slate-700 shadow-2xl overflow-hidden flex flex-col">
      <div class="px-5 py-3 bg-[#131d38] border-b border-slate-800 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center space-x-2">
          <span class="text-sm font-bold text-white">工作区改动 Diff 审阅</span>
          <span id="diff-branch" class="text-[10px] font-mono text-blue-300 px-2 py-0.5 rounded bg-blue-950/60 border border-blue-800/50">--</span>
        </div>
        <button type="button" onclick="closeDiffModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="px-5 py-2 border-b border-slate-800 bg-[#0b1120] text-[11px] font-mono text-slate-400 flex-shrink-0">
        <pre id="diff-stat" class="whitespace-pre-wrap">--</pre>
      </div>
      <pre id="diff-body" class="flex-1 overflow-auto p-4 text-[11px] font-mono text-slate-300 leading-relaxed whitespace-pre">正在读取...</pre>
    </div>
  </div>

  <script>
    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text === undefined || text === null ? '' : text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    const STATUS_TEXT = {
      draft: '规格草稿',
      running: '运行中',
      waiting_gate: '待审批',
      paused: '已暂停',
      completed: '已完成',
      aborted: '已终止',
      failed: '已失败',
    };

    let inst = null;
    let pollTimer = null;

    function instanceId() {
      return new URLSearchParams(window.location.search).get('id') || '';
    }

    function formatElapsedFrom(startTs, endTs) {
      const sec = Math.max(0, Math.floor((endTs - startTs) / 1000));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      if (m >= 60) {
        const h = Math.floor(m / 60);
        return h + '小时' + (m % 60) + '分';
      }
      return m + '分' + s + '秒';
    }

    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function stageStateOf(stage, index) {
      const total = (inst.stages || []).length;
      const cur = inst.currentStageOrder || 1;
      const done = (inst.gateRecords || []).some((g) => g.stageId === stage.id && g.action === 'approve');
      if (inst.status === 'completed') return 'done';
      if (stage.id === inst.currentStageId) {
        if (inst.status === 'waiting_gate') return 'gate';
        if (inst.status === 'paused') return 'paused';
        return 'active';
      }
      if (index + 1 < cur || done) return 'done';
      return 'todo';
    }

    function renderStageFlow() {
      const box = document.getElementById('stage-flow');
      if (!inst) return;
      const stages = inst.stages || [];
      if (stages.length === 0) {
        box.innerHTML = '<div class="text-slate-500 text-xs font-mono">该实例无阶段定义</div>';
        return;
      }

      const cardCls = {
        done: 'bg-emerald-950/30 border border-emerald-500/40',
        active: 'bg-amber-950/40 border-2 border-amber-500 shadow',
        gate: 'bg-purple-950/40 border-2 border-purple-500 shadow',
        paused: 'bg-slate-900 border-2 border-slate-500',
        todo: 'bg-[#090d18] border border-slate-800 opacity-50',
      };
      const numCls = {
        done: 'bg-emerald-500/20 text-emerald-400',
        active: 'bg-amber-500 text-black animate-pulse',
        gate: 'bg-purple-500 text-black animate-pulse',
        paused: 'bg-slate-700 text-slate-300',
        todo: 'bg-slate-800 text-slate-400',
      };
      const titleCls = {
        done: 'text-emerald-300 font-semibold',
        active: 'text-amber-300 font-bold',
        gate: 'text-purple-300 font-bold',
        paused: 'text-slate-300 font-semibold',
        todo: 'text-slate-400 font-medium',
      };

      const cards = stages.map((stage, index) => {
        const st = stageStateOf(stage, index);
        const roleShort = String(stage.roleName || '').split('(')[0].trim();
        let sub = roleShort;
        if (st === 'done') sub = roleShort + ' ✓';
        else if (st === 'active') sub = roleShort + ' (进行中)';
        else if (st === 'gate') sub = roleShort + ' (待审批)';
        else if (st === 'paused') sub = roleShort + ' (已暂停)';
        else sub = roleShort + ' (待)';

        const card = '<div class="flex-1 flex items-center space-x-2 px-2.5 py-1 rounded ' + cardCls[st] + '">'
          + '<span class="w-4 h-4 rounded-full flex items-center justify-center font-mono text-[10px] font-bold ' + numCls[st] + '">' + (index + 1) + '</span>'
          + '<div class="truncate text-[11px]">'
          + '<div class="truncate ' + titleCls[st] + '">' + escapeHtml(roleShort) + '</div>'
          + '<div class="text-[9px] text-slate-400 font-mono truncate">' + escapeHtml(sub) + '</div>'
          + '</div></div>';
        const arrow = index < stages.length - 1 ? '<div class="text-slate-600 text-xs font-mono">&rarr;</div>' : '';
        return card + arrow;
      }).join('');

      box.innerHTML = cards;
      box.className = 'flex items-center space-x-3 w-full max-w-5xl';

      const finished = ['completed', 'aborted', 'failed'].includes(inst.status);
      const start = inst.startedAt || inst.createdAt;
      const end = finished ? (inst.updatedAt || Date.now()) : Date.now();
      document.getElementById('top-elapsed').textContent = '流水线已运行: ' + formatElapsedFrom(start, end);
    }

    function renderChatStream() {
      const box = document.getElementById('chat-stream');
      const logs = inst.logs || [];
      if (logs.length === 0) {
        box.innerHTML = '<div class="p-2.5 rounded bg-[#090e1a] border border-slate-800/80 text-xs text-slate-400 font-mono">该实例暂无活动记录。</div>';
        return;
      }

      const parts = [];
      // 1) 系统初始化提示条（原型样式）
      const startLog = logs.find((l) => l.actor === 'system' && l.type === 'instruction');
      if (startLog) {
        parts.push('<div class="p-2.5 rounded bg-[#090e1a] border border-slate-800/80 text-xs text-slate-400 flex items-center justify-between font-mono">'
          + '<span>🚀 ' + escapeHtml(startLog.content) + '</span>'
          + '<span class="text-slate-500">' + fmtTime(startLog.timestamp) + '</span></div>');
      }

      const stageIndexById = {};
      (inst.stages || []).forEach((s, i) => { stageIndexById[s.id] = i + 1; });
      let pendingTool = null;

      for (const log of logs) {
        if (log === startLog) continue;
        const stageNo = stageIndexById[log.stageId] || log.stageOrder || '-';

        // 人类指令：右对齐蓝色气泡（原型样式）
        if (log.actor === 'human') {
          parts.push('<div class="space-y-1">'
            + '<div class="flex items-center space-x-2 text-[11px] justify-end">'
            + '<span class="text-slate-500 text-[10px]">' + fmtTime(log.timestamp) + '</span>'
            + '<span class="font-bold text-blue-400">人类操作者 (Instruction)</span></div>'
            + '<div class="p-3 rounded-lg bg-blue-600/10 border border-blue-500/30 text-xs text-slate-100 max-w-lg ml-auto leading-relaxed whitespace-pre-wrap">'
            + escapeHtml(log.content) + '</div></div>');
          continue;
        }

        // 系统通知：居中灰条
        if (log.actor === 'system') {
          parts.push('<div class="p-2.5 rounded bg-[#090e1a] border border-slate-800/80 text-xs text-slate-400 flex items-center justify-between font-mono">'
            + '<span>🔔 ' + escapeHtml(log.content) + '</span>'
            + '<span class="text-slate-500">' + fmtTime(log.timestamp) + '</span></div>');
          continue;
        }

        // 工具调用：暂存，等待配对的结果一起渲染成原型工具卡片
        if (log.type === 'tool_call') {
          pendingTool = log;
          continue;
        }

        // 工具结果：与调用配对渲染成「标题 + 工具 + 输出块」卡片
        if (log.type === 'tool_result') {
          const call = pendingTool;
          pendingTool = null;
          const title = (call && call.title) || log.title || '▶ 工具执行';
          const cmd = ((call && call.toolName) || log.toolName || '') + ' ' + ((call && call.toolArgs) || '');
          const outCls = log.isError
            ? 'text-rose-400 bg-rose-950/20 border border-rose-900/40'
            : 'text-emerald-400 bg-emerald-950/20 border border-emerald-900/40';
          parts.push('<div class="space-y-1.5">'
            + '<div class="flex items-center space-x-2 text-[11px]">'
            + '<span class="font-bold text-amber-300 font-mono flex items-center"><span class="w-1.5 h-1.5 rounded-full bg-amber-400 mr-1.5 animate-ping"></span>'
            + escapeHtml(log.roleName) + ' (Stage ' + stageNo + ' · 当前执行者)</span>'
            + '<span class="text-slate-500 text-[10px]">' + fmtTime(log.timestamp) + '</span></div>'
            + '<div class="p-2.5 rounded bg-[#0b101c] border border-slate-800 font-mono text-xs">'
            + '<div class="text-purple-400 font-semibold mb-1">' + escapeHtml(title) + '</div>'
            + '<div class="text-slate-400 text-[11px]"><code class="text-amber-300">' + escapeHtml(cmd.trim()) + '</code></div>'
            + '<div class="mt-2 ' + outCls + ' p-2 rounded text-[11px] whitespace-pre-wrap">' + escapeHtml(log.content) + '</div>'
            + '</div></div>');
          continue;
        }

        // Agent 思考/总结：左对齐气泡（原型样式）
        parts.push('<div class="space-y-1">'
          + '<div class="flex items-center space-x-2 text-[11px]">'
          + '<span class="font-bold text-purple-400 font-mono">' + escapeHtml(log.roleName) + ' (Stage ' + stageNo + ')</span>'
          + '<span class="text-slate-500 text-[10px]">' + fmtTime(log.timestamp) + '</span></div>'
          + '<div class="p-3 rounded-lg bg-[#0e1526] border border-slate-800 text-xs text-slate-200 leading-relaxed whitespace-pre-wrap">'
          + escapeHtml(log.content) + '</div></div>');
      }

      box.innerHTML = parts.join('');
      box.scrollTop = box.scrollHeight;
    }

    function renderSidebar() {
      const stages = inst.stages || [];
      const currentStage = stages.find((s) => s.id === inst.currentStageId) || stages[0];

      // Gatekeeper 卡片
      const gateCard = document.getElementById('gatekeeper-card');
      if (inst.status === 'waiting_gate') {
        gateCard.classList.remove('hidden');
        document.getElementById('gatekeeper-title').textContent = '阶段 ' + (inst.currentStageOrder || 1) + ' 进入审批卡点';
        document.getElementById('gatekeeper-note').textContent =
          '当 ' + (currentStage ? currentStage.roleName : '当前角色') + ' 完成产出后，必须经过人工确认工件后方可激活下一阶段。';
      } else {
        gateCard.classList.add('hidden');
      }

      // 工件列表
      const artifacts = inst.artifacts || [];
      document.getElementById('artifact-count').textContent = artifacts.length + ' Files';
      const list = document.getElementById('artifact-list');
      if (artifacts.length === 0) {
        list.innerHTML = '<div class="text-[11px] text-slate-500 font-mono py-1">暂无交付工件</div>';
      } else {
        list.innerHTML = artifacts.map((a) => {
          const sizeKb = a.sizeBytes ? (a.sizeBytes / 1024).toFixed(1) + ' KB' : '--';
          return '<div class="p-2.5 rounded bg-[#0e1526] border border-slate-800 hover:border-purple-500/50 transition cursor-pointer text-xs">'
            + '<div class="flex items-center justify-between text-slate-300 font-mono text-[11px]">'
            + '<span class="text-blue-400 truncate" title="' + escapeHtml(a.path) + '">📄 ' + escapeHtml(a.path) + '</span>'
            + '<span class="text-slate-500 text-[10px] flex-shrink-0 ml-2">' + sizeKb + '</span></div>'
            + '<div class="text-[10px] text-slate-500 mt-1">由 ' + escapeHtml(a.roleName) + ' 产出</div></div>';
        }).join('');
      }

      // 任务元数据
      document.getElementById('meta-pipeline').textContent = inst.pipelineName || inst.pipelineId || '--';
      document.getElementById('meta-started').textContent = new Date(inst.startedAt || inst.createdAt).toLocaleString();
      document.getElementById('meta-tokens').textContent = String(inst.tokensUsed || 0);
      document.getElementById('meta-task').textContent = inst.taskPrompt || '--';

      // 顶栏当前角色徽标
      const roleBadge = document.getElementById('top-current-role');
      if (currentStage) {
        roleBadge.textContent = String(currentStage.roleName).split('(')[0].trim()
          + ' (Stage ' + (inst.currentStageOrder || 1) + '/' + stages.length + ')';
      } else {
        roleBadge.textContent = STATUS_TEXT[inst.status] || inst.status;
      }
      document.getElementById('composer-role').textContent = currentStage ? String(currentStage.roleName).split('(')[0].trim() : '--';

      // 暂停/恢复按钮
      const pauseBtn = document.getElementById('btn-pause');
      const pausable = inst.status === 'running' || inst.status === 'waiting_gate';
      const resumable = inst.status === 'paused';
      pauseBtn.textContent = resumable ? '继续' : '暂停';
      pauseBtn.disabled = !pausable && !resumable;
      pauseBtn.className = pausable || resumable
        ? 'px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] border border-slate-700 font-medium'
        : 'px-2.5 py-1 rounded bg-slate-900 text-slate-600 text-[10px] border border-slate-800 font-medium cursor-not-allowed';

      // 转交下一阶段：仅在等待审批时可用（如实反映状态，不做假按钮）
      const transferBtn = document.getElementById('btn-transfer');
      if (inst.status === 'waiting_gate') {
        transferBtn.className = 'px-2.5 py-1 rounded bg-purple-600 hover:bg-purple-500 text-white text-[10px] font-medium';
        transferBtn.disabled = false;
      } else {
        transferBtn.className = 'px-2.5 py-1 rounded bg-slate-900 text-slate-600 text-[10px] border border-slate-800 cursor-not-allowed';
        transferBtn.disabled = true;
      }
    }

    function renderAll() {
      if (!inst) return;
      document.getElementById('top-workspace').textContent = inst.workspacePath;
      document.getElementById('composer-workspace').textContent = inst.workspacePath;
      document.getElementById('top-instance-id').textContent = inst.instanceId;
      document.getElementById('top-instance-name').textContent = inst.name || inst.taskPrompt || '';
      renderStageFlow();
      renderChatStream();
      renderSidebar();
    }

    async function pollDetail() {
      const id = instanceId();
      if (!id) { window.location.href = 'run-pipeline.html'; return; }
      try {
        const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(id));
        if (!res.ok) throw new Error('实例不存在或已删除');
        inst = (await res.json()).data;
        renderAll();
        void loadDiffMeta();
      } catch (err) {
        if (pollTimer) clearInterval(pollTimer);
        document.getElementById('chat-stream').innerHTML =
          '<div class="p-3 rounded bg-rose-950/40 border border-rose-900/60 text-rose-300 text-xs font-mono">读取失败: ' + escapeHtml(err.message) + '</div>';
      }
    }

    // 只读 Git 元数据：当前活跃分支（供「任务元数据」展示）
    async function loadDiffMeta() {
      try {
        const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(instanceId()) + '/diff');
        const json = await res.json();
        const d = json.data || {};
        document.getElementById('meta-branch').textContent = d.available ? (d.branch || '--') : '(非 Git 仓库)';
        document.getElementById('top-branch').textContent = d.available && d.branch ? '(' + d.branch + ')' : '';
      } catch { /* 忽略 */ }
    }

    async function openDiffModal() {
      const modal = document.getElementById('diff-modal');
      modal.classList.remove('hidden');
      document.getElementById('diff-body').textContent = '正在读取...';
      try {
        const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(instanceId()) + '/diff');
        const json = await res.json();
        const d = json.data || {};
        document.getElementById('diff-branch').textContent = d.available ? ('分支: ' + d.branch) : '不可用';
        if (!d.available) {
          document.getElementById('diff-stat').textContent = '';
          document.getElementById('diff-body').textContent = '当前工作区不是 Git 仓库或 git 不可用：\n' + (d.reason || '');
          return;
        }
        document.getElementById('diff-stat').textContent = d.stat || '(工作区干净，无未提交改动)';
        document.getElementById('diff-body').textContent = d.diff || '(无未提交改动)';
      } catch (err) {
        document.getElementById('diff-body').textContent = '读取异常: ' + err.message;
      }
    }

    function closeDiffModal() {
      document.getElementById('diff-modal').classList.add('hidden');
    }

    async function togglePause() {
      if (!inst) return;
      const action = inst.status === 'paused' ? 'resume' : 'pause';
      try {
        const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(instanceId()) + '/' + action, { method: 'POST' });
        const json = await res.json();
        if (json.code !== 0) alert(json.message);
      } catch (err) {
        alert('异常: ' + err.message);
      }
      pollDetail();
    }

    async function abortTask() {
      if (!confirm('确定立即终止此流水线任务？已产出的工件与活动记录将完整保留。')) return;
      try {
        const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(instanceId()) + '/abort', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: '用户在工作台手动终止' }),
        });
        const json = await res.json();
        if (json.code !== 0) alert(json.message);
      } catch (err) {
        alert('异常: ' + err.message);
      }
      pollDetail();
    }

    async function deleteTask() {
      if (!confirm('确定彻底删除该流水线任务及其活动记录？此操作不可逆。')) return;
      try {
        const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(instanceId()), { method: 'DELETE' });
        const json = await res.json();
        if (json.code === 0) window.location.href = 'run-pipeline.html';
        else alert(json.message);
      } catch (err) {
        alert('异常: ' + err.message);
      }
    }

    function resolveGateAction(action) {
      if (action === 'reject') {
        const reason = prompt('请输入打回重做原因（将回传给当前角色 Agent）：', '交付物未满足验收标准');
        if (reason === null) return;
        return doResolveGate('reject', reason);
      }
      return doResolveGate('approve');
    }

    async function doResolveGate(action, reason) {
      try {
        const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(instanceId()) + '/gate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, reason }),
        });
        const json = await res.json();
        if (json.code !== 0) alert(json.message);
      } catch (err) {
        alert('异常: ' + err.message);
      }
      pollDetail();
    }

    async function sendInstruction() {
      const input = document.getElementById('composer-input');
      const message = input.value.trim();
      if (!message) return;
      try {
        const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(instanceId()) + '/instruction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const json = await res.json();
        if (json.code === 0) input.value = '';
        else alert(json.message);
      } catch (err) {
        alert('异常: ' + err.message);
      }
      pollDetail();
    }

    window.addEventListener('DOMContentLoaded', () => {
      // 暂停 / 继续
      document.getElementById('btn-pause').addEventListener('click', togglePause);
      // 转交下一阶段（等待审批时等价于批准放行）
      document.getElementById('btn-transfer').addEventListener('click', () => {
        if (!inst || inst.status !== 'waiting_gate') return;
        doResolveGate('approve');
      });
      // Composer：Enter 发送 · Shift+Enter 换行
      document.getElementById('composer-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendInstruction();
        }
      });
      pollDetail();
      pollTimer = setInterval(pollDetail, 2000);
    });
    window.addEventListener('beforeunload', () => {
      if (pollTimer) clearInterval(pollTimer);
    });
  </script>
</body>
</html>
