<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="ico/pgh.svg">
  <title>流水线模板设定 - Purple Grapes Harness (PGH)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/shared.css">
  <script src="js/theme.js"></script>
</head>
<body class="bg-[#070a12] text-slate-100 font-sans app-shell">

  <!-- 统一 40px 顶栏 -->
  <header class="h-10 border-b border-[#1a2333] flex items-center justify-between px-4 bg-[#0a0f1d] shrink-0 text-xs">
    <div class="flex items-center space-x-2.5">
      <img src="ico/pgh.svg" alt="Purple Grapes Harness" class="w-6 h-6 rounded shadow-sm">
      <span class="text-xs font-semibold px-2 py-0.5 rounded bg-purple-950/80 text-purple-300 border border-purple-800/60 font-mono">模式A · 模板库</span>
      <h1 class="text-xs font-bold text-white">多角色流水线定义与模板设定</h1>
    </div>
    <div class="flex items-center space-x-2">
      <button type="button" onclick="createNewTemplate()" class="px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center space-x-1.5 transition shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span>新建流水线模板</span>
      </button>
      <a href="run-pipeline.html" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition">进入运行任务列表</a>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden" style="height: calc(100vh - 40px);">

    <!-- 全系统严格一致的 48px 一级侧边栏 -->
    <aside class="activity-bar h-full">
      <a href="run-chat.html" class="activity-btn" title="对话工作台 (Chat)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
      </a>
      <a href="run-pipeline.html" class="activity-btn" title="角色流水线 (Pipeline)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
      </a>
      <a href="config-workspace.html" class="activity-btn" title="工作区管理与规则">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
      </a>
      <a href="config-memories.html" class="activity-btn" title="记忆管理中心">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
      </a>
      <a href="config-providers.html" class="activity-btn" title="模型与Provider资产">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      </a>
      <a href="config-pipelines.html" class="activity-btn active" title="流水线模板设定">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
      </a>
      <a href="config-mcp.html" class="activity-btn" title="MCP 外部服务">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
      </a>
      <a href="config-skills.html" class="activity-btn" title="Skills 技能库">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </a>
      <div class="flex-1"></div>
      <a href="config-settings.html" class="activity-btn" title="系统全局设置 (Settings)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </a>
    </aside>

    <!-- 主面板 -->
    <main class="flex-1 p-8 max-w-[1720px] w-full mx-auto space-y-6 overflow-y-auto">
      <div class="p-4 rounded-xl bg-gradient-to-r from-purple-950/30 to-blue-950/20 border border-purple-800/40 text-xs text-slate-300 space-y-1">
        <div class="font-bold text-white text-sm">💡 什么是角色流水线 (Role Pipeline)？</div>
        <p class="text-slate-400">
          通过定义标准的「需求分析 → 架构设计 → 编码实现 → 测试验证」等有序角色阶段，将上一 Agent 产出的 Artifact 作为输入严格注入下一阶段，实现高质量工程闭环。
        </p>
      </div>

      <div class="flex items-center justify-between pb-2 border-b border-slate-800 text-xs">
        <div class="text-slate-400 font-mono">已配置流水线模板清单 (<span id="pipe-count" class="text-purple-300 font-bold">0</span>)</div>
        <button onclick="loadPipelines()" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-mono">🔄 刷新模板</button>
      </div>

      <!-- 模板卡片列表 -->
      <div id="pipeline-list" class="space-y-4">
        <div class="p-6 text-center text-slate-500 font-mono text-xs">正在读取流水线模板...</div>
      </div>
    </main>
  </div>

  <script>
    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text === undefined || text === null ? '' : text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    let pipelineCache = [];

    async function loadPipelines() {
      const container = document.getElementById('pipeline-list');
      container.innerHTML = '<div class="p-6 text-center text-slate-500 font-mono text-xs">正在读取流水线模板...</div>';
      try {
        const res = await fetch('/api/pipelines');
        const json = await res.json();
        const list = (json.code === 0 && Array.isArray(json.data)) ? json.data : [];
        pipelineCache = list;
        document.getElementById('pipe-count').textContent = String(list.length);

        if (list.length === 0) {
          container.innerHTML = '<div class="p-8 rounded-xl bg-[#0c1220] border border-slate-800 text-center text-slate-500 text-xs">暂无流水线模板</div>';
          return;
        }

        container.innerHTML = '';
        list.forEach((pipe) => {
          const card = document.createElement('div');
          card.className = 'p-5 rounded-xl bg-[#0c1220] border border-slate-800 hover:border-purple-500/40 transition space-y-4 shadow-lg';

          const stages = pipe.stages || [];
          const stagesHtml = stages.map((s, idx) => `
            <div class="p-2.5 rounded bg-[#090e1a] border border-slate-800/80">
              <div class="text-[10px] text-purple-400 font-bold">STAGE ${idx + 1}: ${escapeHtml(s.name || s.roleName || '阶段')}</div>
              <div class="text-white text-[11px] font-semibold mt-1">${escapeHtml(s.roleName)}</div>
              <div class="text-[10px] text-slate-500 mt-1">${s.gatekeeperRequired ? '产出: artifact (需人工确认)' : '产出: artifact (自动放行)'}</div>
            </div>
          `).join('');

          const isBuiltin = pipe.id === 'pipeline_std_rd';

          card.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="space-y-1">
                <div class="flex items-center space-x-2.5">
                  <h3 class="text-sm font-bold text-white">${escapeHtml(pipe.name)}</h3>
                  ${isBuiltin ? '<span class="text-[10px] px-2 py-0.2 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/60 font-mono">内置推荐</span>' : ''}
                  <span class="text-xs text-slate-500 font-mono">ID: ${escapeHtml(pipe.id)}</span>
                </div>
                <p class="text-xs text-slate-400">${escapeHtml(pipe.description || '（无描述）')}</p>
              </div>

              <div class="flex items-center space-x-2 text-xs">
                <a href="run-pipeline.html" class="px-3 py-1.5 rounded bg-purple-600/90 hover:bg-purple-500 text-white font-medium flex items-center space-x-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                  <span>进入运行任务列表</span>
                </a>
                <a href="config-pipeline-detail.html?id=${encodeURIComponent(pipe.id)}" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center space-x-1">
                  <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                  <span>配置角色与流转规则 &rarr;</span>
                </a>
                ${isBuiltin ? '' : `
                <button type="button" onclick="deleteTemplate('${escapeHtml(pipe.id)}')" class="px-3 py-1.5 rounded bg-rose-950/60 hover:bg-rose-900/70 text-rose-300 border border-rose-900/60 flex items-center space-x-1">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                  <span>删除模板</span>
                </button>`}
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-xs pt-3 border-t border-slate-800/80 font-mono">
              ${stagesHtml || '<div class="text-xs text-slate-500 italic">暂无阶段定义</div>'}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<div class="p-4 rounded bg-rose-950/40 border border-rose-900/60 text-rose-300 text-xs">读取失败: ${escapeHtml(err.message)}</div>`;
      }
    }

    // 直接创建默认模板并进入详情编辑页（名称/描述/阶段统一在详情页内编辑，无弹窗）
    async function createNewTemplate() {
      let baseStages = [];
      try {
        const base = pipelineCache.find((p) => p.id === 'pipeline_std_rd') || pipelineCache[0];
        if (base && Array.isArray(base.stages)) {
          baseStages = base.stages.map((s) => ({
            name: s.name || s.roleName,
            roleName: s.roleName,
            promptTemplate: s.promptTemplate,
            modelId: s.modelId || 'deepseek-chat',
            toolsAllowed: s.toolsAllowed || ['read_file', 'write_file', 'glob', 'grep'],
            artifactPaths: s.artifactPaths || [],
            gatekeeperRequired: s.gatekeeperRequired !== false,
          }));
        }
      } catch { /* ignore, fallback to empty */ }

      try {
        const res = await fetch('/api/pipelines', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: '自定义研发流水线',
            description: '请在此填写该流水线的用途说明',
            stages: baseStages,
          }),
        });
        const json = await res.json();
        if (json.code === 0) {
          window.location.href = `config-pipeline-detail.html?id=${encodeURIComponent(json.data.id)}`;
        } else {
          alert('创建失败: ' + json.message);
        }
      } catch (err) {
        alert('创建异常: ' + err.message);
      }
    }

    async function deleteTemplate(id) {
      const target = pipelineCache.find((p) => p.id === id);
      const label = target ? target.name : id;
      if (!confirm(`确定删除流水线模板「${label}」吗？此操作不可撤销。`)) return;
      try {
        const res = await fetch(`/api/pipelines/${encodeURIComponent(id)}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.code === 0) {
          await loadPipelines();
        } else {
          alert('删除失败: ' + json.message);
        }
      } catch (err) {
        alert('删除异常: ' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', loadPipelines);
  </script>
</body>
</html>
