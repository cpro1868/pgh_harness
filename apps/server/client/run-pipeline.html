  <script>
function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(text === undefined || text === null ? '' : text).replace(/[&<>"']/g, (ch) => map[ch]);
}

let allInstances = [];
let allPipelines = [];
let currentFilter = 'all';

function formatElapsed(inst) {
  const start = inst.startedAt || inst.createdAt;
  const finished = ['completed', 'aborted', 'failed'].includes(inst.status);
  const end = finished ? (inst.updatedAt || Date.now()) : Date.now();
  const sec = Math.max(0, Math.floor((end - start) / 1000));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return h + 'h ' + m + 'm ' + s + 's';
  if (m > 0) return m + 'm ' + s + 's';
  return s + 's';
}

function setFilter(filter, btn) {
  currentFilter = filter;
  const bar = document.getElementById('quick-filter-bar');
  if (bar) {
    Array.from(bar.querySelectorAll('button')).forEach((b) => {
      b.className = 'px-2.5 py-0.5 rounded text-slate-400 hover:text-white';
    });
  }
  if (btn) btn.className = 'px-2.5 py-0.5 rounded bg-slate-800 text-purple-400 font-semibold';
  renderRows();
}

function statusBadgeOf(inst) {
  if (inst.status === 'draft') {
    return '<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-mono text-[10px]">规格草稿</span>';
  }
  if (inst.status === 'waiting_gate') {
    return '<span class="px-2 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-800/60 font-mono text-[10px] flex items-center w-max"><span class="w-1.5 h-1.5 rounded-full bg-purple-400 mr-1.5"></span>待审批 Gate</span>';
  }
  if (inst.status === 'running') {
    return '<span class="px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-800/60 font-mono text-[10px] flex items-center w-max"><span class="w-1.5 h-1.5 rounded-full bg-amber-400 mr-1.5 animate-ping"></span>正在执行</span>';
  }
  if (inst.status === 'completed') {
    return '<span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800/60 font-mono text-[10px]">✓ 验收完成</span>';
  }
  return '<span class="px-2 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-800/60 font-mono text-[10px]">已终止 / 失败</span>';
}

function renderRows() {
  const tbody = document.getElementById('instances-table-body');
  if (!tbody) return;
  const filtered = currentFilter === 'all' ? allInstances : allInstances.filter((i) => i.status === currentFilter);

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="py-12 text-center text-slate-500 font-mono">'
      + '<div class="text-2xl mb-1 font-sans">🚀</div>'
      + '<div>' + (allInstances.length === 0 ? '暂无流水线任务，点击右上角「配置步骤/角色并启动新流水线任务」开工' : '该筛选条件下暂无任务') + '</div>'
      + '</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map((inst) => {
    const stages = inst.stages || [];
    const curOrder = inst.currentStageOrder || 1;
    const pct = Math.min(100, Math.round((curOrder / Math.max(1, stages.length)) * 100));
    const currentStage = stages.find((s) => s.id === inst.currentStageId) || stages[0];
    const isWaitingGate = inst.status === 'waiting_gate';
    const isCompleted = inst.status === 'completed';
    const wsShort = (inst.workspacePath || '').split(/[\\/]/).pop() || inst.workspacePath;
    const startTs = inst.startedAt || inst.createdAt;
    const timeStr = new Date(startTs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const stageLabel = isCompleted ? stages.length + '/' + stages.length + ' 完成' : 'Stage ' + curOrder + '/' + stages.length;

    let actions = '<a href="run-pipeline-create.html?templateId=' + encodeURIComponent(inst.pipelineId) + '" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-[11px] inline-flex items-center space-x-1">'
      + '<svg class="w-3 h-3 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>'
      + '<span>编辑配置</span></a>'
      + '<a href="run-pipeline-detail.html?id=' + encodeURIComponent(inst.instanceId) + '" class="px-3 py-1 rounded ' + (isWaitingGate ? 'bg-purple-600 hover:bg-purple-500 text-white shadow' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700') + ' font-medium text-[11px] inline-flex items-center space-x-1">'
      + '<span>' + (isWaitingGate ? '审查并批准 →' : '进入工作台 →') + '</span></a>';

    if (isCompleted) {
      actions += '<a href="run-pipeline-detail.html?id=' + encodeURIComponent(inst.instanceId) + '" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 text-[11px]"><span>查看工件归档</span></a>';
    }
    actions += '<button onclick="deleteInstance(\'' + escapeHtml(inst.instanceId) + '\')" class="px-2 py-1 rounded bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-300 text-[11px] border border-slate-700">删除</button>';

    return '<tr class="hover:bg-slate-800/40 transition ' + (isWaitingGate ? 'bg-purple-950/10 border-l-2 border-l-purple-500' : '') + '">'
      + '<td class="py-3.5 px-4">'
      + '<div class="font-mono text-purple-300 font-bold">' + escapeHtml(inst.instanceId) + '</div>'
      + '<div class="text-white text-xs font-medium mt-0.5">' + escapeHtml(inst.name || inst.taskPrompt) + '</div>'
      + '<div class="text-[10px] text-slate-500 font-mono mt-0.5">启动于 ' + timeStr + ' (耗时 ' + formatElapsed(inst) + ')</div>'
      + '</td>'
      + '<td class="py-3.5 px-4 font-mono text-[11px] text-slate-300" title="' + escapeHtml(inst.workspacePath) + '">🔒 ' + escapeHtml(wsShort) + '</td>'
      + '<td class="py-3.5 px-4"><span class="font-medium text-slate-200">' + escapeHtml(inst.pipelineName || inst.pipelineId) + '</span></td>'
      + '<td class="py-3.5 px-4">'
      + '<div class="flex items-center space-x-2">'
      + '<div class="w-20 bg-slate-800 rounded-full h-1.5 overflow-hidden"><div class="' + (isCompleted ? 'bg-emerald-400' : 'bg-amber-400') + ' h-1.5 rounded-full" style="width: ' + pct + '%"></div></div>'
      + '<span class="font-mono text-[11px] ' + (isCompleted ? 'text-emerald-400' : 'text-amber-300') + ' font-bold">' + stageLabel + '</span>'
      + '</div>'
      + '<div class="text-[10px] text-slate-400 mt-0.5">' + escapeHtml(currentStage ? currentStage.roleName : '') + '</div>'
      + '</td>'
      + '<td class="py-3.5 px-4 font-mono text-[11px] text-blue-300">' + escapeHtml(currentStage ? currentStage.roleName.split('(')[0].trim() : '--') + '</td>'
      + '<td class="py-3.5 px-4">' + statusBadgeOf(inst) + '</td>'
      + '<td class="py-3.5 px-4 text-right space-x-1.5 whitespace-nowrap">' + actions + '</td>'
      + '</tr>';
  }).join('');
}

async function loadInstances() {
  try {
    const results = await Promise.all([fetch('/api/pipeline-instances'), fetch('/api/pipelines'), fetch('/api/workspaces')]);
    const instJson = await results[0].json();
    const pipeJson = await results[1].json();
    const wsJson = await results[2].json();

    allInstances = (instJson.code === 0 && Array.isArray(instJson.data)) ? instJson.data : [];
    allPipelines = (pipeJson.code === 0 && Array.isArray(pipeJson.data)) ? pipeJson.data : [];
    const wsList = (wsJson.code === 0 && Array.isArray(wsJson.data)) ? wsJson.data : [];

    const elTotal = document.getElementById('metric-total');
    if (elTotal) elTotal.textContent = String(allInstances.length);
    const elRunning = document.getElementById('metric-running');
    if (elRunning) elRunning.textContent = String(allInstances.filter((i) => i.status === 'running').length);
    const elGate = document.getElementById('metric-gate');
    if (elGate) elGate.textContent = String(allInstances.filter((i) => i.status === 'waiting_gate').length);
    const elDone = document.getElementById('metric-done');
    if (elDone) elDone.textContent = String(allInstances.filter((i) => i.status === 'completed').length);

    renderRows();

    const modal = document.getElementById('new-pipeline-modal');
    if (modal) {
      const pipeSel = modal.querySelector('select');
      if (pipeSel && allPipelines.length) {
        pipeSel.innerHTML = allPipelines.map((p) => '<option value="' + escapeHtml(p.id) + '">' + escapeHtml(p.name) + ' (' + (p.stages || []).length + ' 阶段)</option>').join('');
      }
      const wsInput = modal.querySelector('input[type="text"]');
      if (wsInput && wsList.length && !wsInput.value) {
        wsInput.value = wsList[0].path;
      }
    }
  } catch (err) {
    const tbody = document.getElementById('instances-table-body');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-rose-300 font-mono">读取任务失败: ' + escapeHtml(err.message) + '</td></tr>';
    }
  }
}

async function deleteInstance(id) {
  if (!confirm('确定删除流水线任务 "' + id + '" 及其活动记录？此操作不可逆。')) return;
  try {
    const res = await fetch('/api/pipeline-instances/' + encodeURIComponent(id), { method: 'DELETE' });
    const json = await res.json();
    if (json.code === 0) loadInstances(); else alert('删除失败: ' + json.message);
  } catch (err) {
    alert('异常: ' + err.message);
  }
}

async function createAndStartFromModal() {
  const modal = document.getElementById('new-pipeline-modal');
  if (!modal) return;
  const pipelineId = modal.querySelector('select').value;
  const workspacePath = modal.querySelector('input[type="text"]').value.trim();
  const taskPrompt = modal.querySelector('textarea').value.trim();
  if (!workspacePath) { alert('请填写目标工作区目录'); return; }
  if (!taskPrompt) { alert('启动前必须输入明确的需求目标描述（用户指令）！'); return; }

  try {
    const res = await fetch('/api/pipeline-instances/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pipelineId, workspacePath, taskPrompt, instruction: taskPrompt }),
    });
    const json = await res.json();
    if (json.code === 0) {
      window.location.href = 'run-pipeline-detail.html?id=' + encodeURIComponent(json.data.instanceId);
    } else {
      alert('启动失败: ' + json.message);
    }
  } catch (err) {
    alert('异常: ' + err.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  // 将原型弹窗中的静态「立即创建并启动」链接改造为真实提交按钮
  const modal = document.getElementById('new-pipeline-modal');
  if (modal) {
    const trigger = modal.querySelector('a.bg-purple-600');
    if (trigger) {
      trigger.removeAttribute('href');
      trigger.style.cursor = 'pointer';
      trigger.addEventListener('click', createAndStartFromModal);
    }
  }
  loadInstances();
});

  </script>
