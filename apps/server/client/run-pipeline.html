    </div>
    <div class="flex items-center space-x-2">

        <span>📋 模板库</span>

      <a href="run-pipeline-create.html" class="px-3 py-1.5 rounded bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-sm flex items-center space-x-1">
        <span>＋</span><span>启动新流水线任务</span>
      </a>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden" style="height: calc(100vh - 40px);">

    <!-- 全系统严格一致的 48px 一级侧边栏 -->
    <aside class="activity-bar">
      <a href="run-chat.html" class="activity-btn" title="对话工作台 (Chat)">

      </a>
      <a href="run-pipeline.html" class="activity-btn active" title="角色流水线 (Pipeline)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
      </a>
      <a href="config-workspace.html" class="activity-btn" title="工作区管理与规则">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
      </a>
      <a href="config-memories.html" class="activity-btn" title="记忆管理中心">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
      </a>
      <a href="config-providers.html" class="activity-btn" title="模型与Provider资产">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      </a>
      <a href="config-pipelines.html" class="activity-btn" title="流水线模板设定">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
      </a>
      <a href="config-mcp.html" class="activity-btn" title="MCP 外部服务">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>
      </a>
      <a href="config-skills.html" class="activity-btn" title="Skills 技能库">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      </a>
      <div class="flex-1"></div>
      <a href="config-settings.html" class="activity-btn" title="系统全局设置 (Settings)">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </a>
    </aside>

    <!-- 主面板 -->
    <main class="flex-1 p-8 max-w-6xl w-full mx-auto space-y-6 overflow-y-auto">
      
      <!-- 统计指标卡片 -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs font-sans">
        <div class="p-4 rounded-xl bg-[#0c1220] border border-slate-800 space-y-1 shadow">
          <div class="text-slate-400">流水线任务总数</div>
          <div class="text-2xl font-extrabold text-white font-mono"><span id="metric-total">0</span> <span class="text-xs text-slate-500 font-normal">个任务</span></div>
        </div>
        <div class="p-4 rounded-xl bg-[#0c1220] border border-slate-800 space-y-1 shadow">
          <div class="text-amber-400 font-medium flex items-center"><span class="w-2 h-2 rounded-full bg-amber-400 mr-1.5 animate-pulse"></span>正在推进阶段</div>
          <div class="text-2xl font-extrabold text-amber-300 font-mono"><span id="metric-running">0</span> <span class="text-xs text-slate-500 font-normal">Running</span></div>
        </div>
        <div class="p-4 rounded-xl bg-[#0c1220] border border-slate-800 space-y-1 shadow">
          <div class="text-purple-400 font-medium flex items-center"><span class="w-2 h-2 rounded-full bg-purple-400 mr-1.5"></span>待 Gatekeeper 放行</div>
          <div class="text-2xl font-extrabold text-purple-300 font-mono"><span id="metric-gate">0</span> <span class="text-xs text-slate-500 font-normal">待审批</span></div>
        </div>
        <div class="p-4 rounded-xl bg-[#0c1220] border border-slate-800 space-y-1 shadow">
          <div class="text-emerald-400 font-medium flex items-center"><span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5"></span>全流程已完成</div>
          <div class="text-2xl font-extrabold text-emerald-300 font-mono"><span id="metric-done">0</span> <span class="text-xs text-slate-500 font-normal">Completed</span></div>
        </div>
      </div>

      <div class="flex items-center justify-between pb-2 border-b border-slate-800 text-xs">
        <div class="text-slate-400 font-mono">流水线执行实例大屏</div>
        <button onclick="loadInstances()" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-mono">🔄 刷新实例</button>
      </div>

      <!-- 任务列表 -->
      <div id="instance-list" class="space-y-4 font-mono text-xs">
        <div class="p-6 text-center text-slate-500">正在读取流水线任务...</div>
      </div>
    </main>
  </div>

  <script>
    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(text === undefined || text === null ? '' : text).replace(/[&<>"']/g, (ch) => map[ch]);
    }

    async function loadInstances() {
      const container = document.getElementById('instance-list');
      container.innerHTML = '<div class="p-6 text-center text-slate-500">正在读取流水线任务...</div>';
      try {
        const res = await fetch('/api/pipeline-instances');
        const json = await res.json();
        const list = (json.code === 0 && Array.isArray(json.data)) ? json.data : [];

        // 指标
        document.getElementById('metric-total').textContent = String(list.length);
        document.getElementById('metric-running').textContent = String(list.filter((i) => i.status === 'running').length);
        document.getElementById('metric-gate').textContent = String(list.filter((i) => i.status === 'waiting_gate').length);
        document.getElementById('metric-done').textContent = String(list.filter((i) => i.status === 'completed').length);

        if (list.length === 0) {
          container.innerHTML = `
            <div class="p-8 rounded-xl bg-[#0c1220] border border-slate-800 text-center space-y-2">
              <div class="text-2xl">🚀</div>
              <div class="text-slate-300 font-sans font-medium">当前暂无运行中的多角色流水线任务</div>
              <p class="text-[11px] text-slate-500 font-sans">点击右上角「启动新流水线任务」开启四阶段研发闭环。</p>
            </div>`;
          return;
        }

        container.innerHTML = '';
        list.forEach((inst) => {
          const statusCls = inst.status === 'completed'
            ? 'bg-emerald-950 text-emerald-300 border-emerald-800/60'
            : inst.status === 'waiting_gate'
            ? 'bg-purple-950 text-purple-300 border-purple-800/60'
            : inst.status === 'running'
            ? 'bg-amber-950 text-amber-300 border-amber-800/60'
            : 'bg-slate-900 text-slate-400 border-slate-700';

          const card = document.createElement('div');
          card.className = 'p-5 rounded-xl bg-[#0c1220] border border-slate-800 hover:border-slate-700 transition space-y-3 shadow-lg';
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="space-y-1 min-w-0">
                <div class="flex items-center space-x-2">
                  <span class="text-sm font-bold text-white">${escapeHtml(inst.instanceId)}</span>
                  <span class="text-[10px] px-2 py-0.5 rounded font-mono border ${statusCls}">${inst.status.toUpperCase()}</span>
                  <span class="text-[10px] text-slate-500 font-mono">模板: ${escapeHtml(inst.pipelineId)}</span>
                </div>
                <div class="text-xs text-slate-300 font-sans line-clamp-1">${escapeHtml(inst.taskPrompt)}</div>
                <div class="text-[10px] text-slate-500 font-mono truncate">📁 工作区: ${escapeHtml(inst.workspacePath)}</div>
              </div>

              <div class="flex items-center space-x-2 font-sans flex-shrink-0">
                ${inst.status === 'waiting_gate' ? `
                  <button onclick="resolveGate('${escapeHtml(inst.instanceId)}', 'approve')" class="px-3 py-1.5 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs shadow">
                    ✓ 放行 Gatekeeper
                  </button>
                  <button onclick="resolveGate('${escapeHtml(inst.instanceId)}', 'reject')" class="px-3 py-1.5 rounded bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-800/60 text-xs">
                    ✕ 打回重做
                  </button>
                ` : ''}
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<div class="p-4 rounded bg-rose-950/40 border border-rose-900/60 text-rose-300">读取失败: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function resolveGate(instanceId, action) {
      let reason;
      if (action === 'reject') {
        reason = prompt('请输入打回重做原因（将作为上下文注入给 Agent）：', '上游产出工件不完备');
        if (reason === null) return;
      }
      try {
        const res = await fetch(`/api/pipeline-instances/${encodeURIComponent(instanceId)}/gate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, reason }),
        });
        const json = await res.json();
        if (json.code === 0) {
          loadInstances();
        } else {
          alert('裁决下发失败: ' + json.message);
        }
      } catch (err) {
        alert('网络异常: ' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', loadInstances);
  </script>
</body>
</html>
