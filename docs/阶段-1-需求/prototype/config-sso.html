  <main class="flex-1 p-6 overflow-y-auto">
<div class='p-6'>
    <div class='flex items-center justify-between mb-5'>
      <div><h1 class='text-lg font-bold text-white flex items-center space-x-2'><span>🔑</span><span>SSO 身份对接</span><span class='text-[9px] px-1.5 py-0.5 rounded bg-violet-950/60 text-violet-300 font-mono'>v2.0 MOD-13</span></h1><p class='text-[11px] text-slate-500 mt-0.5'>对接企业既有身份系统，员工使用企业账号一键登录</p></div>
    </div>
    <div class='grid grid-cols-3 gap-4 mb-5'>
      <div class='p-4 rounded-xl bg-[#0f1523] border border-emerald-800/50 cursor-pointer hover:border-emerald-600 transition'><div class='flex items-center justify-between mb-2'><span class='text-xl'>🔐</span><span class='px-2 py-0.5 rounded bg-emerald-950/50 text-emerald-400 text-[10px] font-mono'>已启用</span></div><div class='text-xs font-bold text-white mb-1'>OIDC 通用协议</div><div class='text-[10px] text-slate-500'>Azure AD / Keycloak / Authing</div><div class='text-[10px] text-slate-600 mt-2 font-mono truncate'>issuer: https://sso.company.com/realms/main</div></div>
      <div class='p-4 rounded-xl bg-[#0f1523] border border-slate-800 cursor-pointer hover:border-blue-500 transition'><div class='flex items-center justify-between mb-2'><span class='text-xl'>📇</span><span class='px-2 py-0.5 rounded bg-slate-800 text-slate-500 text-[10px] font-mono'>未启用</span></div><div class='text-xs font-bold text-white mb-1'>LDAP / Active Directory</div><div class='text-[10px] text-slate-500'>企业 AD 域直连（bind + search）</div></div>
      <div class='p-4 rounded-xl bg-[#0f1523] border border-slate-800 cursor-pointer hover:border-blue-500 transition'><div class='flex items-center justify-between mb-2'><span class='text-xl'>💬</span><span class='px-2 py-0.5 rounded bg-slate-800 text-slate-500 text-[10px] font-mono'>接口预留</span></div><div class='text-xs font-bold text-white mb-1'>飞书 / 钉钉 / 企微</div><div class='text-[10px] text-slate-500'>扫码登录（按客户需求逐个交付）</div></div>
    </div>
    <div class='rounded-xl bg-[#0f1523] border border-slate-800 p-4 space-y-3'>
      <h3 class='text-xs font-bold text-slate-300'>OIDC 配置详情</h3>
      <div class='grid grid-cols-2 gap-3 text-[11px]'>
        <div><label class='text-slate-500 block mb-1'>Issuer URL</label><input value='https://sso.company.com/realms/main' class='w-full bg-[#080d1a] border border-slate-700 rounded px-3 py-2 text-slate-200 font-mono' readonly></div>
        <div><label class='text-slate-500 block mb-1'>Client ID</label><input value='pgh-harness' class='w-full bg-[#080d1a] border border-slate-700 rounded px-3 py-2 text-slate-200 font-mono' readonly></div>
        <div><label class='text-slate-500 block mb-1'>Client Secret</label><input type='password' value='••••••••••••' class='w-full bg-[#080d1a] border border-slate-700 rounded px-3 py-2 text-slate-200 font-mono' readonly></div>
        <div><label class='text-slate-500 block mb-1'>角色映射字段（Claim）</label><input value='groups' class='w-full bg-[#080d1a] border border-slate-700 rounded px-3 py-2 text-slate-200 font-mono' readonly></div>
      </div>
      <div class='flex space-x-2'><button class='px-4 py-1.5 rounded bg-blue-600 text-white text-xs font-semibold'>保存配置</button><button class='px-4 py-1.5 rounded bg-slate-700 text-slate-300 text-xs'>测试连接</button></div>
    </div>
