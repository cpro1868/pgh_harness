<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 结构化提问 - Harness Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/shared.css">
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex flex-col">

  <!-- 原型全局导航条 -->
  <div class="proto-nav">
    <div class="flex items-center space-x-3">
      <span class="font-bold text-blue-400 flex items-center">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        Harness
      </span>
      <span class="text-xs text-slate-500 border-l border-slate-700 pl-3">MOD-04 ask_user 结构化反问</span>
    </div>
    <div class="flex items-center space-x-1">
      <a href="index.html">原型导航</a>
      <a href="run-chat.html">主对话</a>
      <a href="run-terminal.html">终端执行</a>
      <a href="approval-modal.html">审批弹窗</a>
      <a href="question-interaction.html" class="active font-medium">结构化提问</a>
      <a href="run-trajectory.html">事件轨迹</a>
      <a href="config-providers.html">模型端点</a>
      <a href="config-permissions.html">权限规则</a>
    </div>
  </div>

  <div class="max-w-3xl mx-auto px-6 py-10 flex-1 w-full space-y-6">
    <div>
      <h1 class="text-2xl font-bold text-white mb-1">Agent 结构化澄清提问 (ask_user)</h1>
      <p class="text-xs text-slate-400">当模型发现业务规则模糊或存在多种实现路径时，主动发起结构化交互，避免脑补。</p>
    </div>

    <!-- 提问交互卡片 (内置于对话流中) -->
    <div class="border border-purple-500/50 rounded-xl bg-[#11182c] shadow-xl overflow-hidden">
      
      <!-- 卡片头 -->
      <div class="p-3.5 bg-purple-950/40 border-b border-purple-500/30 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="p-1.5 rounded bg-purple-500/20 text-purple-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <span class="text-xs font-semibold text-purple-200">Agent 正在等待您的确认 (Question)</span>
        </div>
        <span class="text-[10px] font-mono bg-purple-900/60 text-purple-300 px-2 py-0.5 rounded border border-purple-700/50">挂起中</span>
      </div>

      <!-- 提问正文 -->
      <div class="p-5 space-y-4 text-xs">
        <p class="text-slate-200 text-sm leading-relaxed">
          在分析 <code class="font-mono text-xs bg-slate-800 px-1 py-0.5 rounded text-blue-300">parseTokenAmount</code> 的溢出边界时，发现了两种可能的处理方式。请问您希望如何处理超出范围的整数输入？
        </p>

        <!-- 选项列表 (单选模式) -->
        <div class="space-y-2.5">
          
          <label class="flex items-start p-3 rounded-lg bg-[#0c1222] border border-blue-500/60 cursor-pointer transition">
            <input type="radio" name="opt" checked class="mt-0.5 text-blue-600 bg-slate-800 border-slate-700 focus:ring-0">
            <div class="ml-3">
              <span class="text-sm font-medium text-white block">方案 1：直接抛出 RangeError 异常（推荐）</span>
              <span class="text-xs text-slate-400 mt-0.5 block">明确拒绝无效输入，防止脏数据继续流向下游计算模块。</span>
            </div>
          </label>

          <label class="flex items-start p-3 rounded-lg bg-[#0c1222] border border-slate-800 hover:border-slate-700 cursor-pointer transition">
            <input type="radio" name="opt" class="mt-0.5 text-blue-600 bg-slate-800 border-slate-700 focus:ring-0">
            <div class="ml-3">
              <span class="text-sm font-medium text-slate-200 block">方案 2：自动截断为 MAX_SAFE_INTEGER</span>
              <span class="text-xs text-slate-400 mt-0.5 block">宽容模式，记录一条 warning 日志，但允许调用继续执行。</span>
            </div>
          </label>

          <label class="flex items-start p-3 rounded-lg bg-[#0c1222] border border-slate-800 hover:border-slate-700 cursor-pointer transition">
            <input type="radio" name="opt" class="mt-0.5 text-blue-600 bg-slate-800 border-slate-700 focus:ring-0">
            <div class="ml-3">
              <span class="text-sm font-medium text-slate-200 block">方案 3：全面升级支持 BigInt 任意大数计算</span>
              <span class="text-xs text-slate-400 mt-0.5 block">保留超大数精度，但需要连带改动 3 处下游消费函数的类型签名。</span>
            </div>
          </label>

        </div>

        <!-- 自由补充输入框 -->
        <div class="pt-2">
          <label class="text-[11px] text-slate-400 block mb-1">补充说明（可选）：</label>
          <input type="text" placeholder="如果有其他特定业务要求，请在此处补充..." class="w-full bg-[#090d16] border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <!-- 底栏提交 -->
      <div class="p-4 bg-[#0a0f1d] border-t border-slate-800 flex justify-end">
        <button class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-md transition flex items-center space-x-1.5">
          <span>提交回复并继续 (Submit & Continue)</span>
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </div>

    </div>
  </div>

</body>
</html>
